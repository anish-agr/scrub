<!DOCTYPE html>
<!-- STYLE: Swiss nurse-station case register on warm paper. -->
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrub cases</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="scrub-ui" data-page="cases">
  <header class="top">
    <div><span class="mark">Scrub</span><span class="subtitle">Case register</span></div>
    <nav>
      <a href="/">Count</a>
      <a href="cases.html" aria-current="page">Cases</a>
      <a href="card.html">Table card</a>
    </nav>
  </header>
  <p id="status" class="banner warning" role="status" hidden></p>
  <main>
    <section>
      <p class="kicker">Cases</p>
      <h1>Case record</h1>
      <p class="note">Open a case to read its requests, handoff times and instrument count.</p>
      <p id="cases-count" class="note"></p>
      <ul id="cases" class="cases"></ul>
      <button id="more" type="button" class="toggle" hidden></button>
    </section>
  </main>
  <footer>Team Scrub · DubHacks '26</footer>
  <script src="cases.js"></script>
</body>
</html>
