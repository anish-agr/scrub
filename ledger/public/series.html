<!DOCTYPE html>
<!-- STYLE: Swiss nurse-station timing sheet, minute-by-minute handoffs. -->
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrub series</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="scrub-ui" data-page="series">
  <header class="top">
    <div><span class="mark">Scrub</span><span class="subtitle">Handoff timing record</span></div>
    <nav>
      <a href="/">Count</a>
      <a href="cases.html">Cases</a>
      <a href="series.html" aria-current="page">Series</a>
      <a href="memory.html">Memory</a>
      <a href="card.html">Table card</a>
    </nav>
  </header>
  <p id="status" class="banner warning" role="status" hidden></p>
  <main class="has-rows">
    <section>
      <p class="kicker">Handoffs over time</p>
      <h1>Handoffs by minute</h1>
      <p id="source" class="source-line"><b id="source-word">Checking</b><span id="source-text" class="note"></span></p>
      <p class="legend">One bar per minute with handoffs. Real means the real arm; the rest are fake-arm or simulated runs.</p>
      <div id="bars" class="bars"></div>
      <p id="empty" class="note" hidden>No handoffs yet.</p>
    </section>
  </main>
  <footer>Team Scrub · DubHacks '26</footer>
  <script src="series.js"></script>
</body>
</html>
