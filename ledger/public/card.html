<!DOCTYPE html>
<!-- STYLE: Swiss printed tray tag, square rules and a scannable QR plate. -->
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrub table card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="scrub-ui" data-page="card">
  <header class="top">
    <div><span class="mark">Scrub</span><span class="subtitle">Table card · Research prototype</span></div>
    <nav>
      <a href="/">Count</a>
      <a href="cases.html">Cases</a>
      <a href="series.html">Series</a>
      <a href="memory.html">Memory</a>
      <a href="card.html" aria-current="page">Table card</a>
    </nav>
  </header>
  <article class="card">
    <p class="kicker">On the table</p>
    <h1>Scrub</h1>
    <p class="ask">Ask for an instrument out loud. Scrub hands it to you.</p>
    <div class="plate"><img id="qr" src="qr.png" alt="QR code for the Scrub page" width="260" height="260"></div>
    <p id="url" class="url"></p>
    <p class="phone">Scan for the live count and results.</p>
    <p class="phone">Ask us for the number to call.</p>
  </article>
  <footer>Team Scrub · DubHacks '26</footer>
  <script>
    fetch("/api/public", { cache: "no-store" })
      .then((response) => response.json())
      .then((body) => {
        document.getElementById("url").textContent = body.url || "";
        document.getElementById("qr").src = "qr.png?u=" + encodeURIComponent(body.url || "");
      })
      .catch(() => {});
  </script>
</body>
</html>
