<!DOCTYPE html>
<!-- STYLE: Swiss ruled case replay sheet, time-first event record. -->
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrub case</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="scrub-ui" data-page="case">
  <header class="top">
    <div><span class="mark">Scrub</span><span class="subtitle">Case replay</span></div>
    <nav>
      <a href="/">Count</a>
      <a href="cases.html" aria-current="page">Cases</a>
      <a href="series.html">Series</a>
      <a href="memory.html">Memory</a>
      <a href="card.html">Table card</a>
    </nav>
  </header>
  <p id="status" class="banner warning" role="status" hidden></p>
  <main>
    <section>
      <p class="kicker" id="case-id">Case</p>
      <h1>Requests and count</h1>
      <p id="summary" class="summary"></p>
      <button id="toggle-steps" class="toggle" type="button" hidden></button>
      <ol id="timeline" class="timeline"></ol>
    </section>
  </main>
  <footer>Team Scrub · DubHacks '26</footer>
  <script src="cases.js"></script>
</body>
</html>
