<!DOCTYPE html>
<!-- STYLE: Swiss nurse-station notes and instrument request sheet. -->
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrub memory</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="scrub-ui" data-page="memory">
  <header class="top">
    <div><span class="mark">Scrub</span><span class="subtitle">Instrument request notes</span></div>
    <nav>
      <a href="/">Count</a>
      <a href="cases.html">Cases</a>
      <a href="series.html">Series</a>
      <a href="memory.html" aria-current="page">Memory</a>
      <a href="card.html">Table card</a>
    </nav>
  </header>
  <p id="status" class="banner warning" role="status" hidden></p>
  <main class="has-rows">
    <section>
      <p class="kicker">What comes next</p>
      <h1>Ask about past requests</h1>
      <p id="mode" class="source-line"><b id="mode-word">Checking</b><span id="mode-text" class="note"></span></p>
      <label for="q">Question</label>
      <form id="ask">
        <input id="q" name="q" placeholder="what usually follows hemostat" autocomplete="off">
        <button type="submit">Ask</button>
      </form>
      <div id="answer" aria-live="polite"><p id="answer-from" class="answer-from" hidden></p><p id="answer-text" class="summary"></p></div>
    </section>
    <section>
      <p class="kicker">Notes</p>
      <ul id="notes" class="cases"></ul>
    </section>
  </main>
  <footer>Team Scrub · DubHacks '26</footer>
  <script src="memory.js"></script>
</body>
</html>
