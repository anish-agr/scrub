<!doctype html>
<!--
FEATURES:
- Floor plan of a care home wing with 7 SO-101 arms, one per resident room, live status (idle/running/needs help/stopped)
- Animated arm glyphs, per-room task progress, live telemetry simulation
- Alert queue with P1/P2/P3 priorities, ack/resolve, aging timers, new alerts arriving live
- Staff assignment by drag and drop (staff chip onto alert or room) with tap fallback select
- Per-robot drawer: last 10 tasks, success rate, battery, temperature sparkline, canvas camera snapshot, per-robot STOP and resume
- Global STOP ALL latch, shift summary view computed from live counters
- Filter by status, keyboard friendly
-->
<!-- SPONSORS: Perceptron Robotics (fleet of fine-tuned SO-101), Perceptron Perception (camera events feed alerts), Photon (staff paging via iMessage/SMS), Tiger Data (telemetry time series), MongoDB Atlas (task log) -->
<!-- BACKEND HOOKS: GET /api/state (per robot), WS /ws events (status, alert, telemetry), POST /api/request (queue task), POST /api/stop (latched stop per robot or all), POST /api/assign {alertId, staffId}, GET /api/shift-summary, GET /api/camera/:robotId.jpg -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care Fleet Ops</title>
<meta name="description" content="Operations console for a fleet of care-home robot arms with live status, alert queue, staff assignment and shift summary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14;--panel:#121722;--panel2:#171d2b;--line:#232b3d;--line2:#2d3750;
  --tx:#e6eaf3;--mut:#8591ab;--dim:#5b6783;
  --idle:#6b7a99;--run:#2dd4a0;--help:#ffb020;--stop:#ff4d5e;--acc:#6e8bff;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}
button,select{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
body{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.site{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{min-height:44px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);cursor:pointer;font-weight:500}
.tab.on{color:var(--tx);border-color:var(--acc)}
.sp{flex:1}
#clock{color:var(--mut);font-size:13px}
.stopall{min-height:44px;padding:0 18px;background:var(--stop);border:0;border-radius:8px;color:#fff;font-weight:700;letter-spacing:.5px;cursor:pointer;box-shadow:0 0 0 3px rgba(255,77,94,.2)}
.stopall.latched{background:#2a1015;color:var(--stop);border:1px solid var(--stop);box-shadow:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:pointer;text-align:left}
.kpi.on{border-color:var(--acc);background:var(--panel2)}
.kpi b{display:block;font-size:22px;font-weight:600}
.kpi span{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-idle{--c:var(--idle)}.s-running{--c:var(--run)}.s-help{--c:var(--help)}.s-stopped{--c:var(--stop)}
.dot{background:var(--c)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:12px;padding:12px 16px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>h2{margin:0;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h2 .n{margin-left:auto;background:var(--panel2);border-radius:99px;padding:1px 8px;color:var(--tx)}
/* floor plan */
.plan{position:relative;padding:14px;background:
 linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px;background-color:#0e121b}
.wing{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto 56px auto;gap:10px}
.hall{grid-column:1/-1;grid-row:2;border:1px dashed var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:space-around;color:var(--dim);font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.015)}
.room{position:relative;min-height:150px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .1s;display:flex;flex-direction:column}
.room:hover{border-color:var(--c)}
.room.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(110,139,255,.25)}
.room.drop{border-color:var(--acc);background:#18203a}
.room.s-help{box-shadow:0 0 0 1px var(--help),0 0 18px rgba(255,176,32,.25);animation:pulse 1.6s infinite}
.room.s-stopped{box-shadow:0 0 0 1px var(--stop)}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--help),0 0 4px rgba(255,176,32,.05)}}
.room .top{display:flex;align-items:center;gap:6px;font-size:12px}
.room .top b{font-weight:600}
.room .top .st{margin-left:auto;color:var(--c);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.room .res{color:var(--mut);font-size:11px}
.room svg{width:100%;height:70px;margin:2px 0}
.room .task{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--c);transition:width .6s}
.room .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:5px;font-size:11px;color:var(--mut)}
.asg{background:var(--panel2);border:1px solid var(--line2);border-radius:99px;padding:1px 8px;color:var(--tx);font-size:11px}
.asg.none{color:var(--dim);border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
/* right column */
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.alerts{max-height:430px;overflow:auto}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);position:relative;transition:background .2s}
.alert.drop{background:#18203a}
.alert.new{animation:flash 1.2s}
@keyframes flash{from{background:#3a2c10}to{background:transparent}}
.pri{font-weight:700;font-size:11px;padding:2px 6px;border-radius:5px;height:max-content;font-family:'JetBrains Mono',monospace}
.p1{background:rgba(255,77,94,.16);color:var(--stop)}.p2{background:rgba(255,176,32,.16);color:var(--help)}.p3{background:rgba(110,139,255,.16);color:var(--acc)}
.alert .msg{font-weight:500}
.alert .meta{grid-column:2/4;color:var(--mut);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert .acts{grid-column:1/4;display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri-b{background:var(--acc);border-color:var(--acc);color:#0b0e14;font-weight:600}
.btn.sm{min-height:44px}
.alert select{min-height:44px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:0 8px}
.empty{padding:24px;text-align:center;color:var(--dim)}
.staff{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;min-height:44px;background:var(--panel2);border:1px solid var(--line2);border-radius:99px;cursor:grab;user-select:none;touch-action:none}
.chip:active{cursor:grabbing}
.chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0b0e14}
.chip small{display:block;color:var(--mut);font-size:11px;line-height:1}
.chip.busy{opacity:.55}
.hint{padding:0 14px 12px;color:var(--dim);font-size:12px}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .25s;z-index:50;display:flex;flex-direction:column;overflow:auto}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .hd h3{margin:0;font-size:16px}
.x{margin-left:auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:600}
canvas{width:100%;display:block;border-radius:8px;background:#05070b}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--mut)}
.tl{width:100%;border-collapse:collapse;font-size:12px}
.tl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.tl td:last-child{text-align:right}
.ok{color:var(--run)}.bad{color:var(--stop)}.warn{color:var(--help)}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.btn.danger{background:var(--stop);border-color:var(--stop);color:#fff;font-weight:700}
/* summary */
.sum{display:none;padding:12px 16px 20px;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.sum.on{display:grid}
.sum .card{padding:0}
.sum .body{padding:14px}
.big{font-size:34px;font-weight:600}
.hb{display:grid;grid-template-columns:90px 1fr 48px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.hb .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:99px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>CareFleet</div>
  <div class="site">Maple Court, East Wing &middot; Day shift</div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-view="fleet">Fleet</button>
    <button class="tab" data-view="summary">Shift summary</button>
  </div>
  <div class="sp"></div>
  <div id="clock" class="mono"></div>
  <button class="stopall" id="stopall" aria-label="Stop all robots">STOP ALL</button>
</header>

<div id="fleetView">
  <div class="kpis" id="kpis"></div>
  <main>
    <section class="card">
      <h2>Floor plan <span class="mono" style="color:var(--dim)">wing E / level 1</span><span class="n" id="planN"></span></h2>
      <div class="plan"><div class="wing" id="wing"></div></div>
      <div class="legend">
        <span><i class="dot s-running"></i>Running</span><span><i class="dot s-idle"></i>Idle</span>
        <span><i class="dot s-help"></i>Needs help</span><span><i class="dot s-stopped"></i>Stopped</span>
        <span style="margin-left:auto">Click a room for details</span>
      </div>
    </section>
    <div class="col">
      <section class="card">
        <h2>Alert queue <span class="n" id="alertN">0</span></h2>
        <div class="alerts" id="alerts"></div>
      </section>
      <section class="card">
        <h2>Staff on shift</h2>
        <div class="staff" id="staff"></div>
        <div class="hint">Drag a person onto an alert or a room to assign. On touch, use the Assign menu on an alert.</div>
      </section>
    </div>
  </main>
</div>

<div class="sum" id="summary"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Robot details"></aside>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TASKS=['Fetch water cup','Open pill organizer','Hand over remote','Pick up dropped item','Tidy bedside tray','Fetch glasses','Place meal tray','Hold phone for call'];
const STAFF=[
 {id:'s1',name:'Priya N.',role:'Nurse',col:'#2dd4a0'},
 {id:'s2',name:'Marcus T.',role:'Aide',col:'#6e8bff'},
 {id:'s3',name:'Elena R.',role:'Charge RN',col:'#ffb020'},
 {id:'s4',name:'Sam O.',role:'Aide',col:'#ff7ab8'},
 {id:'s5',name:'Dana K.',role:'Tech',col:'#5ad1ff'}];
const R=[
 ['E101','Mr. Okafor'],['E102','Mrs. Lindqvist'],['E103','Mr. Tran'],['E104','Ms. Brightwater'],
 ['E105','Mr. Haddad'],['E106','Mrs. Castillo'],['E107','Mr. Ito']
].map((r,i)=>({id:'R'+(i+1),room:r[0],res:r[1],status:['running','idle','running','idle','running','idle','running'][i],
 task:pick(TASKS),prog:rnd(0,.9),batt:Math.round(rnd(48,96)),temp:rnd(34,44),tempH:[],staff:null,
 hist:[],succ:Math.round(rnd(91,99)),ang:rnd(0,6),stopReason:''}));
R.forEach(r=>{for(let i=0;i<24;i++)r.tempH.push(r.temp+rnd(-1.5,1.5));
 for(let i=0;i<10;i++)r.hist.push(mkTask(i));});
function mkTask(i){const ok=Math.random()>.1;return{t:fmt(new Date(Date.now()-(i+1)*rnd(8,22)*60000)),name:pick(TASKS),ok:ok,dur:Math.round(rnd(14,52))}}
function fmt(d){return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
let alerts=[],aid=100,stats={done:212,ok:204,interv:7,resp:[],paged:3},allStop=false,filter=null,sel=null,view='fleet';
const SC={idle:'Idle',running:'Running',help:'Needs help',stopped:'Stopped'};
const ALERT_T=[
 [1,'Grasp failed 3 times, object not found','help'],
 [1,'Contact force above limit near resident','stopped'],
 [2,'Pill organizer lid not detected, awaiting caregiver OK','help'],
 [2,'Camera view blocked by blanket','help'],
 [3,'Battery below 25 percent, needs dock','idle'],
 [3,'Calibration drift 2.1 mm, schedule check','idle']];
function addAlert(rb,tpl,silent){
  const a={id:++aid,rid:rb.id,p:tpl[0],msg:tpl[1],at:Date.now()-(silent?rnd(60,900)*1000:0),staff:rb.staff,ack:false,isNew:!silent};
  alerts.push(a);
  if(tpl[2]==='help'||tpl[2]==='stopped'){rb.status=tpl[2];rb.stopReason=tpl[1]}
  if(tpl[2]==='stopped')rb.stopReason=tpl[1];
  return a;
}
// seed
addAlert(R[1],ALERT_T[2],1);R[1].status='help';
addAlert(R[4],ALERT_T[4],1);
addAlert(R[5],ALERT_T[3],1);R[5].status='help';

function armSVG(r){
 const a=r.ang;
 const x1=60+Math.cos(a)*34,y1=62-Math.abs(Math.sin(a))*34-10;
 const x2=x1+Math.cos(a*1.7+1)*30,y2=y1-Math.abs(Math.sin(a*1.3))*22+8;
 return `<svg viewBox="0 0 120 70"><rect x="0" y="62" width="120" height="8" fill="#0e121b"/><rect x="48" y="56" width="24" height="10" rx="3" fill="#2d3750"/>
 <line x1="60" y1="58" x2="${x1}" y2="${y1}" stroke="var(--c)" stroke-width="6" stroke-linecap="round"/>
 <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--c)" stroke-width="5" stroke-linecap="round" opacity=".8"/>
 <circle cx="${x1}" cy="${y1}" r="4" fill="#0b0e14" stroke="var(--c)" stroke-width="2"/>
 <circle cx="${x2}" cy="${y2}" r="3" fill="var(--c)"/><rect x="96" y="52" width="16" height="10" rx="2" fill="#232b3d"/></svg>`;
}
function renderWing(){
 const w=$('#wing');
 const order=[0,1,2,3];const bot=[4,5,6];
 let h='';
 order.forEach(i=>h+=roomHTML(R[i],1));
 h+='<div class="hall"><span>Corridor</span><span>Nurse station</span><span>Dock bay</span></div>';
 bot.forEach(i=>h+=roomHTML(R[i],3));
 h+=`<div class="room" style="cursor:default;border-style:dashed;min-height:150px;grid-row:3"><div class="top"><b>Day room</b></div><div class="res" style="margin-top:6px">No robot assigned. Spare SO-101 on charger.</div></div>`;
 w.innerHTML=h;
 w.querySelectorAll('.room[data-id]').forEach(el=>{
  el.onclick=()=>openDrawer(el.dataset.id);
  el.ondragover=e=>{e.preventDefault();el.classList.add('drop')};
  el.ondragleave=()=>el.classList.remove('drop');
  el.ondrop=e=>{e.preventDefault();el.classList.remove('drop');assignRobot(el.dataset.id,e.dataTransfer.getData('text/plain'))};
 });
}
function roomHTML(r,row){
 const dim=filter&&filter!==r.status?'opacity:.35':'';
 const s=STAFF.find(x=>x.id===r.staff);
 return `<div class="room s-${r.status} ${sel===r.id?'sel':''}" data-id="${r.id}" style="grid-row:${row};${dim}" data-pid="${r.id}">
 <div class="top"><b class="mono">${r.room}</b><span class="res">${r.res}</span><span class="st">${SC[r.status]}</span></div>
 ${armSVG(r)}
 <div class="task">${r.status==='running'?r.task:(r.status==='idle'?'Waiting for request':r.stopReason||'Halted')}</div>
 <div class="bar"><i style="width:${r.status==='running'?r.prog*100:0}%"></i></div>
 <div class="foot"><span class="mono">${r.batt}% &middot; ${r.temp.toFixed(0)}C</span><span class="asg ${s?'':'none'}">${s?s.name:'unassigned'}</span></div></div>`;
}
function renderKpis(){
 const c={running:0,idle:0,help:0,stopped:0};R.forEach(r=>c[r.status]++);
 $('#kpis').innerHTML=Object.keys(c).map(k=>`<button class="kpi s-${k} ${filter===k?'on':''}" data-f="${k}"><b>${c[k]}</b><span><i class="dot"></i>${SC[k]}</span></button>`).join('')+
 `<div class="kpi" style="cursor:default"><b>${Math.round(stats.ok/stats.done*100)}%</b><span>Shift success</span></div>`+
 `<div class="kpi" style="cursor:default"><b>${stats.done}</b><span>Tasks today</span></div>`;
 document.querySelectorAll('.kpi[data-f]').forEach(b=>b.onclick=()=>{filter=filter===b.dataset.f?null:b.dataset.f;renderAll()});
 $('#planN').textContent=R.length+' robots';
}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<60?s+'s':Math.floor(s/60)+'m '+(s%60)+'s'}
function renderAlerts(){
 const list=alerts.slice().sort((a,b)=>a.p-b.p||a.at-b.at);
 $('#alertN').textContent=list.length;
 $('#alerts').innerHTML=list.length?list.map(a=>{
  const rb=R.find(r=>r.id===a.rid),s=STAFF.find(x=>x.id===a.staff);
  const h=`<div class="alert ${a.isNew?'new':''}" data-aid="${a.id}">
  <span class="pri p${a.p}">P${a.p}</span><div class="msg">${a.msg}</div><span class="mono" style="color:var(--mut)" data-age="${a.at}">${ago(a.at)}</span>
  <div class="meta"><span class="mono">${rb.room}</span><span>${rb.res}</span><span class="asg ${s?'':'none'}">${s?s.name:'drop staff here'}</span>${a.ack?'<span class="ok">acknowledged</span>':''}</div>
  <div class="acts"><select data-as="${a.id}" aria-label="Assign staff"><option value="">Assign...</option>${STAFF.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
  <button class="btn" data-ack="${a.id}">Ack</button><button class="btn" data-open="${rb.id}">Open</button><button class="btn pri-b" data-res="${a.id}">Resolve</button></div></div>`;
  a.isNew=false;return h}).join(''):'<div class="empty">All clear. No open alerts.</div>';
 document.querySelectorAll('.alert').forEach(el=>{
  el.ondragover=e=>{e.preventDefault();el.classList.add('drop')};
  el.ondragleave=()=>el.classList.remove('drop');
  el.ondrop=e=>{e.preventDefault();el.classList.remove('drop');assignAlert(+el.dataset.aid,e.dataTransfer.getData('text/plain'))};
 });
 document.querySelectorAll('[data-as]').forEach(s=>s.onchange=()=>s.value&&assignAlert(+s.dataset.as,s.value));
 document.querySelectorAll('[data-ack]').forEach(b=>b.onclick=()=>{const a=alerts.find(x=>x.id==b.dataset.ack);a.ack=true;renderAlerts()});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.open));
 document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>resolve(+b.dataset.res));
}
function renderStaff(){
 $('#staff').innerHTML=STAFF.map(s=>{
  const n=alerts.filter(a=>a.staff===s.id).length+R.filter(r=>r.staff===s.id&&!alerts.some(a=>a.rid===r.id&&a.staff===s.id)).length;
  return `<div class="chip ${n>2?'busy':''}" draggable="true" data-sid="${s.id}"><span class="av" style="background:${s.col}">${s.name[0]}</span><div>${s.name}<small>${s.role} &middot; ${n} assigned</small></div></div>`}).join('');
 document.querySelectorAll('.chip').forEach(c=>{
  c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.sid);
  touchDrag(c);
 });
}
// touch drag fallback
function touchDrag(c){
 let g=null;
 c.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  g=c.cloneNode(true);g.className='chip ghost';document.body.appendChild(g);mv(e);
  c.setPointerCapture(e.pointerId);
 });
 function mv(e){if(g){g.style.left=e.clientX-30+'px';g.style.top=e.clientY-30+'px'}}
 c.addEventListener('pointermove',mv);
 c.addEventListener('pointerup',e=>{
  if(!g)return;g.remove();g=null;
  const t=document.elementFromPoint(e.clientX,e.clientY);if(!t)return;
  const al=t.closest('.alert'),rm=t.closest('.room[data-id]');
  if(al)assignAlert(+al.dataset.aid,c.dataset.sid);else if(rm)assignRobot(rm.dataset.id,c.dataset.sid);
 });
}
function assignAlert(id,sid){
 const a=alerts.find(x=>x.id===id),s=STAFF.find(x=>x.id===sid);if(!a||!s)return;
 a.staff=sid;a.ack=true;R.find(r=>r.id===a.rid).staff=sid;stats.paged++;
 stats.resp.push(Math.round((Date.now()-a.at)/1000));
 toast(`${s.name} assigned to ${R.find(r=>r.id===a.rid).room}. Paged via SMS.`);renderAll();
}
function assignRobot(rid,sid){
 const s=STAFF.find(x=>x.id===sid),r=R.find(x=>x.id===rid);if(!s||!r)return;
 r.staff=sid;alerts.filter(a=>a.rid===rid).forEach(a=>{a.staff=sid;a.ack=true});
 toast(`${s.name} assigned to ${r.room}.`);renderAll();
}
function resolve(id){
 const a=alerts.find(x=>x.id===id);if(!a)return;
 const r=R.find(x=>x.id===a.rid);alerts=alerts.filter(x=>x.id!==id);stats.interv++;
 if(!alerts.some(x=>x.rid===r.id)&&(r.status==='help'||(r.status==='stopped'&&!allStop))){r.status='idle';r.stopReason='';r.staff=null}
 toast(`Alert resolved for ${r.room}.`);renderAll();
}
function stopRobot(r){r.status='stopped';r.stopReason='Manual STOP latched';
 if(!alerts.some(a=>a.rid===r.id&&a.p===1))alerts.push({id:++aid,rid:r.id,p:1,msg:'Manual STOP latched, check area before resume',at:Date.now(),staff:null,ack:false,isNew:true});}
function resumeRobot(r){
 if(allStop){toast('Release STOP ALL first.');return}
 r.status='idle';r.stopReason='';alerts=alerts.filter(a=>!(a.rid===r.id&&a.msg.startsWith('Manual STOP')));renderAll();
}
$('#stopall').onclick=()=>{
 allStop=!allStop;
 if(allStop){R.forEach(stopRobot);toast('All arms halted. Torque disabled.')}
 else{R.forEach(r=>{r.status='idle';r.stopReason=''});alerts=alerts.filter(a=>!a.msg.startsWith('Manual STOP'));toast('STOP released. Arms idle.')}
 $('#stopall').textContent=allStop?'RELEASE STOP':'STOP ALL';$('#stopall').classList.toggle('latched',allStop);renderAll();
};
// drawer
function openDrawer(id){sel=id;renderAll();drawDrawer();$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
function closeDrawer(){sel=null;$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');renderAll()}
$('#scrim').onclick=closeDrawer;
function drawDrawer(){
 const r=R.find(x=>x.id===sel);if(!r)return;
 const s=STAFF.find(x=>x.id===r.staff);
 const ok=r.hist.filter(h=>h.ok).length;
 $('#drawer').innerHTML=`<div class="hd s-${r.status}"><i class="dot"></i><h3>${r.room} &middot; ${r.res}</h3><span class="mono" style="color:var(--c)">${SC[r.status]}</span><button class="x" aria-label="Close" id="cx">&times;</button></div>
 <div class="sec"><h4>Camera snapshot (wrist + room)</h4><canvas id="cam" width="400" height="225"></canvas>
  <div class="mono" style="color:var(--mut);font-size:11px;margin-top:6px">cam0 640x360 &middot; detected: cup 0.94, tray 0.88, hand 0.71</div></div>
 <div class="sec"><div class="grid2">
  <div class="stat"><b>${r.succ}%</b><span>Success (30d)</span></div>
  <div class="stat"><b class="${r.batt<30?'warn':''}">${r.batt}%</b><span>Battery</span></div>
  <div class="stat"><b class="${r.temp>42?'warn':''}">${r.temp.toFixed(1)}C</b><span>Motor temp</span></div></div>
  <canvas id="spark" width="400" height="60" style="margin-top:8px;height:60px"></canvas></div>
 <div class="sec"><h4>Current task</h4><div>${r.status==='running'?r.task+' ('+Math.round(r.prog*100)+'%)':(r.stopReason||'None')}</div>
  <div style="color:var(--mut);margin-top:4px">Assigned: ${s?s.name+' ('+s.role+')':'nobody'}</div></div>
 <div class="sec"><h4>Last 10 tasks &middot; ${ok}/10 ok</h4><table class="tl">${r.hist.map(h=>`<tr><td class="mono" style="color:var(--mut)">${h.t}</td><td>${h.name}</td><td class="mono">${h.dur}s</td><td class="${h.ok?'ok':'bad'}">${h.ok?'OK':'FAIL'}</td></tr>`).join('')}</table></div>
 <div class="sec"><div class="row">${r.status==='stopped'?'<button class="btn pri-b" id="rs">Resume (idle)</button>':'<button class="btn danger" id="st">STOP THIS ARM</button>'}
  <button class="btn" id="rq">Queue task</button></div></div>`;
 $('#cx').onclick=closeDrawer;
 const st=$('#st');if(st)st.onclick=()=>{stopRobot(r);renderAll();drawDrawer()};
 const rs=$('#rs');if(rs)rs.onclick=()=>{resumeRobot(r);drawDrawer()};
 $('#rq').onclick=()=>{if(r.status==='idle'){r.status='running';r.task=pick(TASKS);r.prog=0;toast('Task queued on '+r.room);renderAll();drawDrawer()}else toast('Arm is not idle.')};
 drawCam(r);drawSpark(r);
}
function drawCam(r){
 const c=$('#cam');if(!c)return;const x=c.getContext('2d'),W=400,H=225,t=Date.now()/1000;
 x.fillStyle='#1a2030';x.fillRect(0,0,W,H);
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#232b3d');g.addColorStop(1,'#10141e');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#3a2f2a';x.fillRect(0,150,W,75);
 x.fillStyle='#2b3350';x.fillRect(250,60,120,70);x.fillStyle='#394468';x.fillRect(255,66,110,58);
 x.fillStyle='#6b4a3a';x.fillRect(40,135,140,12);
 x.fillStyle='#e9eef8';x.fillRect(90,112,22,24);x.strokeStyle='#2dd4a0';x.lineWidth=2;x.strokeRect(84,106,34,36);
 x.fillStyle='#2dd4a0';x.font='10px JetBrains Mono';x.fillText('cup 0.94',84,100);
 const ax=200+Math.cos(r.ang)*60,ay=100-Math.abs(Math.sin(r.ang))*40;
 x.strokeStyle='#9aa7c8';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(330,225);x.lineTo(ax,ay);x.stroke();
 x.fillStyle='#6e8bff';x.beginPath();x.arc(ax,ay,8,0,7);x.fill();
 for(let i=0;i<260;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.06})`;x.fillRect(Math.random()*W,Math.random()*H,2,2)}
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,20);x.fillStyle='#ff4d5e';x.beginPath();x.arc(12,10,4,0,7);x.fill();
 x.fillStyle='#e6eaf3';x.fillText('REC '+r.room+'  '+new Date().toLocaleTimeString(),24,14);
}
function drawSpark(r){
 const c=$('#spark');if(!c)return;const x=c.getContext('2d'),W=400,H=60;x.clearRect(0,0,W,H);
 x.strokeStyle='#6e8bff';x.lineWidth=2;x.beginPath();
 r.tempH.forEach((v,i)=>{const px=i/(r.tempH.length-1)*W,py=H-6-(v-30)/20*(H-12);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
 x.fillStyle='#8591ab';x.font='10px JetBrains Mono';x.fillText('motor temp, last 2 min',4,12);
}
// summary
function renderSummary(){
 const avg=stats.resp.length?Math.round(stats.resp.reduce((a,b)=>a+b)/stats.resp.length):42;
 const mx=Math.max(...R.map(r=>r.hist.length+r.succ/10));
 $('#summary').innerHTML=`
 <div class="card"><h2>Throughput</h2><div class="body"><div class="big">${stats.done}</div><div style="color:var(--mut)">tasks completed, ${Math.round(stats.ok/stats.done*100)}% first-try success</div>
  <div style="margin-top:12px;color:var(--mut)">Human interventions: <b style="color:var(--tx)">${stats.interv}</b> &middot; Staff pages: <b style="color:var(--tx)">${stats.paged}</b></div></div></div>
 <div class="card"><h2>Response time</h2><div class="body"><div class="big mono">${avg}s</div><div style="color:var(--mut)">mean time from alert to staff assignment</div>
  <div style="margin-top:12px;color:var(--mut)">Target under 60s &middot; <span class="${avg<60?'ok':'warn'}">${avg<60?'on target':'above target'}</span></div></div></div>
 <div class="card"><h2>Open now</h2><div class="body"><div class="big">${alerts.length}</div><div style="color:var(--mut)">P1: ${alerts.filter(a=>a.p==1).length} &middot; P2: ${alerts.filter(a=>a.p==2).length} &middot; P3: ${alerts.filter(a=>a.p==3).length}</div></div></div>
 <div class="card" style="grid-column:1/-1"><h2>Per robot reliability</h2><div class="body">${R.map(r=>`<div class="hb"><span class="mono">${r.room}</span><div class="tr"><i style="width:${r.succ}%"></i></div><span class="mono">${r.succ}%</span></div>`).join('')}</div></div>
 <div class="card" style="grid-column:1/-1"><h2>Handover notes (auto-drafted)</h2><div class="body" style="color:var(--mut)">
  Two pill-organizer requests needed caregiver approval this shift. E106 camera was blocked by bedding twice; consider repositioning the mount. E105 battery trending low, dock before evening meal service. No resident contact events above threshold.</div></div>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2400)}
function renderAll(){renderKpis();renderWing();renderAlerts();renderStaff();if(view==='summary')renderSummary();if(sel)drawDrawer()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
 view=t.dataset.view;$('#fleetView').style.display=view==='fleet'?'':'none';$('#summary').classList.toggle('on',view==='summary');
 if(view==='summary')renderSummary();
});
// simulation
setInterval(()=>{
 if(!allStop)R.forEach(r=>{
  if(r.status==='running'){
   r.prog+=rnd(.03,.09);r.ang+=rnd(.15,.5);
   if(r.prog>=1){stats.done++;const ok=Math.random()>.07;if(ok)stats.ok++;
    r.hist.unshift({t:fmt(new Date()),name:r.task,ok:ok,dur:Math.round(rnd(14,50))});r.hist.length=10;
    r.status='idle';r.prog=0;
    if(!ok&&!alerts.some(a=>a.rid===r.id))addAlert(r,ALERT_T[0]);}
  }else if(r.status==='idle'&&Math.random()<.12&&r.batt>25){r.status='running';r.task=pick(TASKS);r.prog=0}
  r.temp+=(r.status==='running'?.15:-.1)*rnd(.3,1)+rnd(-.1,.1);r.temp=Math.min(46,Math.max(33,r.temp));
  r.tempH.push(r.temp);r.tempH.shift();
  if(r.status==='running')r.batt=Math.max(8,r.batt-(Math.random()<.08?1:0));
 });
 if(!allStop&&Math.random()<.12&&alerts.length<8){
  const r=pick(R.filter(r=>!alerts.some(a=>a.rid===r.id)));
  if(r)addAlert(r,pick(ALERT_T));
 }
 renderKpis();renderWing();if(alerts.some(a=>a.isNew)||document.querySelectorAll('.alert').length!==alerts.length)renderAlerts();
 renderStaff();if(sel&&document.activeElement.tagName!=='SELECT'){drawDrawer()}
 if(view==='summary')renderSummary();
},1500);
setInterval(()=>{
 document.querySelectorAll('[data-age]').forEach(e=>e.textContent=ago(+e.dataset.age));
 $('#clock').textContent=new Date().toLocaleTimeString();
 if(sel){const r=R.find(x=>x.id===sel);if(r){r.ang+=.05;drawCam(r)}}
},1000);
renderAll();$('#clock').textContent=new Date().toLocaleTimeString();
</script>
</body>
</html>
