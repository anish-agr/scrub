<!DOCTYPE html>
<!-- FEATURES:
- Mock under-sink camera with Perceptron OCR boxes reading each product label
- Hazard class + GHS pictogram badges per product (oxidizer, acid, base, flammable, general)
- Incompatibility engine: bleach vs ammonia/acid, acid vs base, flammable vs oxidizer, plus vertical drip pairs
- Child-lock zone rule: corrosives and laundry pods must end up behind the lock
- Before / after shelf diagrams with red conflict lines; arm sorts live through a staging tray
- Rule checklist with pass/fail, latched STOP, activity log
-->
<!-- SPONSORS: Perceptron Perception (OCR + object localization), Perceptron Robotics (pick/place checkpoint), Gemini API (hazard classification from label text), Backboard (product memory), MongoDB Atlas (product catalog) -->
<!-- BACKEND HOOKS: POST /api/detect {mode:"ocr"} -> label text per object; POST /api/request {task:"sort_cabinet", layout}; GET /api/state; POST /api/stop; WS /ws events: ocr.label, hazard.classified, arm.pick, arm.place, layout.verified -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Sink Sorter</title>
<meta name="description" content="A robot arm reads cleaning product labels and rearranges the cabinet so incompatible chemicals never touch and the dangerous ones sit behind a child lock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#ffc800;--k:#14130f;--bg:#efede4;--card:#fbfaf5;--ink:#14130f;--mut:#6a665a;--line:#d6d2c2;--red:#d8312a;--grn:#1f8a4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,var(--k) 14px 28px)}
header{background:var(--k);color:#fff;display:flex;gap:14px;align-items:center;padding:12px 20px;flex-wrap:wrap}
h1{font:700 28px 'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase;margin:0}h1 span{color:var(--y)}
.sp{flex:1}
.tag{font:600 12px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border:1.5px solid var(--y);color:var(--y)}
.tag.red{border-color:var(--red);color:#ff7d76}.tag.grn{border-color:#4ad07e;color:#4ad07e}
button{font:600 15px Barlow;min-height:44px;padding:0 18px;border:2px solid var(--k);background:var(--card);color:var(--k);cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
button.pri{background:var(--y)}button.pri:hover{background:#ffd633}button:disabled{opacity:.4;cursor:not-allowed}
button.stop{background:var(--red);color:#fff;border-color:#fff;font-weight:700;min-width:100px}button.stop.latched{outline:3px solid var(--y)}
main{max-width:1400px;margin:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}}
.panel{background:var(--card);border:2px solid var(--k);padding:14px;position:relative}
.panel::before{content:'';position:absolute;left:-2px;top:-2px;width:46px;height:8px;background:var(--y);border:2px solid var(--k);border-bottom:0}
h2{font:700 17px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;margin:6px 0 10px}
canvas{width:100%;display:block;border:2px solid var(--k);background:#2a2a24}
.prod{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center;cursor:default}
.prod:last-child{border:0}.prod b{font-weight:600}.prod small{display:block;color:var(--mut);font-size:12px}
.prod.hl{background:#fff4c2;margin:0 -6px;padding:8px 6px}
.cls{display:inline-block;font:700 11px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;margin-right:4px;color:#fff}
.ghs{display:flex;gap:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
svg text{font-family:Barlow,sans-serif}
.rules{list-style:none;padding:0;margin:0}.rules li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rules li:last-child{border:0}.rules .b{width:26px;height:26px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--mut);flex:none}
.rules li.ok .b{background:var(--grn)}.rules li.bad .b{background:var(--red)}.rules li .n{margin-left:auto;font:700 13px 'Barlow Condensed';letter-spacing:.06em}
.stat{font:700 44px/1 'Barlow Condensed'}.stat.bad{color:var(--red)}.stat.ok{color:var(--grn)}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;max-height:120px;overflow:auto;color:var(--mut)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.legend{font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <h1>Under Sink <span>Sorter</span></h1>
  <span class="tag" id="mode">Mock arm</span><span class="tag grn" id="armst">Arm idle</span>
  <div class="sp"></div>
  <button class="stop" id="stop" aria-label="Emergency stop">STOP</button>
</header>
<div class="stripe" style="height:6px"></div>
<main>
  <div>
    <section class="panel">
      <h2>Camera and OCR</h2>
      <canvas id="cam" width="480" height="300"></canvas>
      <div class="ctrl" style="margin:12px 0 0"><button class="pri" id="scan" style="flex:1">1. Scan labels</button></div>
      <div id="prods" style="margin-top:8px"></div>
    </section>
  </div>
  <div>
    <div class="ctrl">
      <button class="pri" id="sort" disabled>2. Sort cabinet</button>
      <button id="reset">Reset</button>
      <div class="sp"></div>
      <div style="text-align:right"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)">Open conflicts</div><div class="stat bad" id="cnt">0</div></div>
    </div>
    <div class="grid2">
      <section class="panel"><h2>Before</h2><svg id="sbefore" viewBox="0 0 440 300"></svg></section>
      <section class="panel"><h2 id="aftitle">Live view</h2><svg id="safter" viewBox="0 0 440 340"></svg></section>
    </div>
    <div class="legend"><span><i style="background:var(--red)"></i>Incompatible neighbours</span><span><i style="background:var(--k)"></i>Lock zone boundary</span><span>Rule: no bleach next to ammonia or acid</span></div>
    <div class="grid2" style="margin-top:16px">
      <section class="panel"><h2>Safety rules</h2><ul class="rules" id="rules"></ul></section>
      <section class="panel"><h2>Activity</h2><div class="log" id="log"></div></section>
    </div>
  </div>
</main>
<script>
const CLS={ox:['Oxidizer','#c96a00'],acid:['Acid','#c0392b'],base:['Base','#6a3fa0'],flam:['Flammable','#d8312a'],gen:['General','#5a6a5a']};
const items=[
 {id:'bleach',name:'Chlorine Bleach',cls:'ox',ghs:['ox','corr'],lock:1,ocr:'DANGER. Sodium hypochlorite 6%. Never mix with ammonia or acids.',c:'#e8e8d8'},
 {id:'amm',name:'Glass Cleaner (ammonia)',cls:'base',ghs:['corr','exc'],lock:1,ocr:'WARNING. Ammonium hydroxide 5%. Do not mix with bleach.',c:'#6fb4e8'},
 {id:'acid',name:'Toilet Bowl Acid',cls:'acid',ghs:['corr'],lock:1,ocr:'DANGER. Hydrochloric acid 9.5%. Corrosive. Keep from children.',c:'#4c9a6a'},
 {id:'drain',name:'Drain Opener (lye)',cls:'base',ghs:['corr','skull'],lock:1,ocr:'DANGER. Sodium hydroxide. Causes severe burns.',c:'#c0392b'},
 {id:'thin',name:'Paint Thinner',cls:'flam',ghs:['flame','health'],lock:0,ocr:'DANGER. Extremely flammable. Keep away from heat and bleach.',c:'#d9a441'},
 {id:'ligh',name:'Lighter Fluid',cls:'flam',ghs:['flame','health'],lock:0,ocr:'DANGER. Flammable liquid and vapor. Harmful if swallowed.',c:'#b84a2c'},
 {id:'soap',name:'Dish Soap',cls:'gen',ghs:[],lock:0,ocr:'Ultra dish liquid. Eye irritant. Rinse if contact.',c:'#f2d02c'},
 {id:'pods',name:'Laundry Pods',cls:'gen',ghs:['exc'],lock:1,ocr:'CAUTION. Keep out of reach of children. Do not ingest.',c:'#e87aa0'}];
const byId=Object.fromEntries(items.map(i=>[i.id,i]));
const BAD=[['ox','base'],['ox','acid'],['acid','base'],['flam','ox']];
const bad=(a,b)=>BAD.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
const BEFORE={bleach:[0,0],amm:[0,1],thin:[0,2],soap:[0,3],drain:[0,4],ligh:[1,0],acid:[1,1],pods:[1,2]};
const AFTER={bleach:[0,0],pods:[0,1],acid:[0,2],amm:[0,3],drain:[0,4],soap:[1,0],thin:[1,3],ligh:[1,4]};
const WALLS_AFTER=[[0,1],[0,2],[1,2]]; // [shelf, boundary after col b]
const COLS=5,SW=70,X0=40,Y0=40,SH=100;
let pos=JSON.parse(JSON.stringify(BEFORE)),walls=[],snap=JSON.parse(JSON.stringify(BEFORE)),scanned=false,stopped=false,busy=false,done=false,floating=null,arm=null;
const $=id=>document.getElementById(id);
function log(t){const d=document.createElement('div');d.innerHTML='<b style="color:#14130f">'+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</b> '+t;$('log').prepend(d)}
function setArm(t,c){$('armst').textContent=t;$('armst').className='tag '+(c||'')}
// GHS pictograms
function ghs(k,x,y,s){const g={corr:'<path d="M-6-8h12l-3 5h-6zM-3 2l1.5 4M3 2l-1 6" stroke="#000" stroke-width="2" fill="none"/>',flame:'<path d="M0-9C4-3 7 0 6 5A6 6 0 0 1-6 5C-6 1-2-1 0-9z" fill="#000"/>',ox:'<circle cx="0" cy="3" r="4" fill="none" stroke="#000" stroke-width="2"/><path d="M0-9C3-5 4-3 3 0h-6C-3-3 0-5 0-9z" fill="#000"/>',exc:'<rect x="-1.5" y="-8" width="3" height="10" fill="#000"/><circle cy="6" r="2" fill="#000"/>',skull:'<text y="6" text-anchor="middle" font-size="16">&#9760;</text>',health:'<text y="6" text-anchor="middle" font-size="14">&#9888;</text>'}[k];
  return `<g transform="translate(${x} ${y}) scale(${s/22})"><rect x="-11" y="-11" width="22" height="22" transform="rotate(45)" fill="#fff" stroke="#d8312a" stroke-width="2.6"/><g transform="scale(.8)">${g}</g></g>`}
function ghsHtml(a){return a.length?`<svg width="${a.length*26}" height="26" viewBox="0 0 ${a.length*26} 26" style="display:block">${a.map((k,i)=>ghs(k,13+i*26,13,22)).join('')}</svg>`:'<span style="font-size:12px;color:var(--mut)">No GHS</span>'}
// products list
function renderProds(){ $('prods').innerHTML=items.map(i=>`<div class="prod" id="p_${i.id}"><div><b>${i.name}</b>${scanned?`<small>"${i.ocr}"</small>`:'<small>Not scanned</small>'}${scanned?`<span class="cls" style="background:${CLS[i.cls][1]}">${CLS[i.cls][0]}</span>${i.lock?'<span class="cls" style="background:#14130f">Lock zone</span>':''}`:''}</div><div>${scanned?ghsHtml(i.ghs):''}</div></div>`).join('')}
renderProds();
// camera
const cv=$('cam'),cx=cv.getContext('2d');let scanIdx=-1,scanTimer=0;
function bottle(x,y,w,h,col,t){cx.fillStyle=col;cx.beginPath();cx.roundRect(x,y,w,h,5);cx.fill();cx.fillStyle='#222';cx.fillRect(x+w*.3,y-9,w*.4,10);cx.fillStyle='rgba(255,255,255,.85)';cx.fillRect(x+4,y+h*.35,w-8,h*.35);cx.fillStyle='#111';cx.font='600 8px Barlow';cx.fillText(t,x+6,y+h*.55)}
function drawCam(now){const t=now/1000;cx.fillStyle='#34342c';cx.fillRect(0,0,480,300);
  cx.fillStyle='#46463c';cx.fillRect(0,0,480,16);cx.fillRect(0,130,480,10);cx.fillRect(0,275,480,25);
  cx.fillStyle='#14130f';cx.fillRect(0,16,480,114);cx.fillStyle='#1c1b16';cx.fillRect(0,140,480,135);
  const snp=snap;
  items.forEach((it,k)=>{const p=snp[it.id];if(!p)return;const x=22+p[1]*88+Math.sin(t+k)*0.7,y=p[0]?150:30,w=60,h=p[0]?100:90;bottle(x,y+(p[0]?0:0),w,h-(p[0]?0:0),it.c,it.name.split(' ')[0]);
    if(scanIdx>=0&&k<=scanIdx||scanned){cx.strokeStyle=scanIdx===k?'#ffc800':'#4ad07e';cx.lineWidth=2;cx.strokeRect(x-3,y-3,w+6,h+6);cx.fillStyle=scanIdx===k?'#ffc800':'#4ad07e';cx.fillRect(x-3,y-17,66,14);cx.fillStyle='#000';cx.font='700 9px Barlow';cx.fillText(scanIdx===k?'READING...':CLS[it.cls][0].toUpperCase(),x,y-6)}});
  if(scanIdx>=0&&scanIdx<items.length){const p=snp[items[scanIdx].id],x=22+p[1]*88,y=p[0]?150:30;cx.fillStyle='rgba(255,200,0,.3)';cx.fillRect(x-6,y+((t*2)%1)*90,72,5)}
  cx.fillStyle='#fff';cx.font='500 11px ui-monospace,Menlo';cx.fillText('CAM1 sink  UNDER-CABINET  '+(scanIdx>=0&&scanIdx<items.length?'OCR '+(scanIdx+1)+'/8':'LIVE'),10,12);
  requestAnimationFrame(drawCam)}
requestAnimationFrame(drawCam);
$('scan').onclick=()=>{if(stopped||busy)return;scanned=false;scanIdx=0;renderProds();$('scan').disabled=true;log('Perceptron OCR sweep started');
  const iv=setInterval(()=>{if(stopped){clearInterval(iv);$('scan').disabled=false;scanIdx=-1;return}
    const it=items[scanIdx];const el=$('p_'+it.id);if(el){el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),500)}
    $('p_'+it.id).querySelector('small').textContent='"'+it.ocr+'"';log('Read <b>'+it.name+'</b>: '+CLS[it.cls][0]);
    scanIdx++;if(scanIdx>=items.length){clearInterval(iv);scanIdx=-1;scanned=true;renderProds();$('scan').disabled=false;$('sort').disabled=false;log('Classification complete. '+conflicts(pos,[]).length+' conflicts found.');draw()}},650)};
// conflicts
function conflicts(P,W){const out=[],ids=Object.keys(P);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=P[ids[i]],b=P[ids[j]];if(!a||!b)continue;
    if(!bad(byId[ids[i]].cls,byId[ids[j]].cls))continue;
    if(a[0]===b[0]&&Math.abs(a[1]-b[1])===1){const lo=Math.min(a[1],b[1]);if(!W.some(w=>w[0]===a[0]&&w[1]===lo))out.push([ids[i],ids[j],'side'])}
    else if(a[1]===b[1]&&a[0]!==b[0])out.push([ids[i],ids[j],'drip'])}
  return out}
// cabinet SVG
function cab(P,W,conf,extra,locked){const w=X0*2+COLS*SW;let s=`<rect x="10" y="10" width="${w-20}" height="${extra?250:220}" fill="#e9e5d2" stroke="#14130f" stroke-width="3"/>`;
  // lock zone
  if(locked)s+=`<rect x="22" y="${Y0-14}" width="${COLS*SW+36}" height="${SH+20}" fill="rgba(255,200,0,.18)" stroke="#14130f" stroke-width="3" stroke-dasharray="10 6"/><g transform="translate(${w-44} ${Y0-2})"><rect x="-12" y="-4" width="24" height="18" fill="#14130f"/><path d="M-7-4V-10a7 7 0 0 1 14 0V-4" fill="none" stroke="#14130f" stroke-width="3"/><circle cy="5" r="2.5" fill="#ffc800"/></g><text x="30" y="${Y0-18}" font-size="12" font-weight="700" fill="#14130f" letter-spacing="1.5">CHILD-LOCK ZONE</text>`;
  [0,1].forEach(r=>{s+=`<rect x="${X0-10}" y="${Y0+SH-8+r*(SH+10)-(r?0:0)}" width="${COLS*SW+20}" height="8" fill="#14130f"/>`});
  W.forEach(([r,b])=>{const x=X0+(b+1)*SW-4;s+=`<rect x="${x}" y="${Y0+r*(SH+10)-8}" width="8" height="${SH}" fill="#14130f" opacity=".85"/>`});
  items.forEach(it=>{const p=P[it.id];if(!p||it===floating)return;s+=bot(it,X0+p[1]*SW+SW/2,Y0+p[0]*(SH+10)+SH-8)});
  conf.forEach(([a,b,k])=>{const pa=P[a],pb=P[b];const ax=X0+pa[1]*SW+SW/2,ay=Y0+pa[0]*(SH+10)+SH/2,bx=X0+pb[1]*SW+SW/2,by=Y0+pb[0]*(SH+10)+SH/2;
    s+=`<path d="M${ax} ${ay}L${bx} ${by}" stroke="#d8312a" stroke-width="5" stroke-dasharray="9 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><g transform="translate(${(ax+bx)/2} ${(ay+by)/2})"><circle r="11" fill="#d8312a" stroke="#fff" stroke-width="2"/><text y="5" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">!</text></g>`});
  return s}
function bot(it,cx_,by,fl){const h=it.id==='pods'?50:70,w=44;let s=`<g transform="translate(${cx_} ${by})"><rect x="${-w/2}" y="${-h}" width="${w}" height="${h}" rx="6" fill="${it.c}" stroke="#14130f" stroke-width="2"/><rect x="-8" y="${-h-9}" width="16" height="10" fill="#14130f"/><rect x="${-w/2+4}" y="${-h+h*.35}" width="${w-8}" height="${h*.4}" fill="#fff" opacity=".85"/><text y="${-h+h*.6}" text-anchor="middle" font-size="9" font-weight="700" fill="#14130f">${it.name.split(' ')[0].slice(0,9).toUpperCase()}</text>`;
  s+=`<rect x="-11" y="${-h-24}" width="22" height="12" fill="${CLS[it.cls][1]}"/><text y="${-h-15}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">${it.cls.toUpperCase()}</text>`;
  if(it.ghs[0])s+=ghs(it.ghs[0],0,-h*.12-3,18);return s+'</g>'}
function draw(){
  $('sbefore').innerHTML=cab(snap,[],conflicts(snap,[]),false,false);
  const lw=done?WALLS_AFTER:walls,c=conflicts(pos,lw);
  let s=cab(pos,lw,c,true,scanned||done);
  // tray
  s+=`<rect x="30" y="${Y0+2*(SH+10)-6}" width="${COLS*SW+20}" height="30" fill="#14130f" opacity=".1" stroke="#14130f" stroke-dasharray="4 4"/><text x="40" y="${Y0+2*(SH+10)+13}" font-size="11" fill="#6a665a" letter-spacing="1">STAGING TRAY</text>`;
  Object.keys(trayItems).forEach(id=>{const t=trayXY(trayItems[id]);s+=bot(byId[id],t.x,t.y+28)});
  if(floating)s+=bot(byId[floating.id],floating.x,floating.y+30);
  if(arm)s+=armSvg();
  $('safter').innerHTML=s;
  $('cnt').textContent=c.length;$('cnt').className='stat '+(c.length?'bad':'ok');
  rules(c,lw)}
function armSvg(){const B={x:395,y:330},a1=170,a2=150,dx=arm.x-B.x,dy=arm.y-B.y,d=Math.min(Math.hypot(dx,dy),a1+a2-1),an=Math.atan2(dy,dx),k=Math.acos(Math.max(-1,Math.min(1,(a1*a1+d*d-a2*a2)/(2*a1*d)))),ex=B.x+a1*Math.cos(an+k),ey=B.y+a1*Math.sin(an+k),tx=B.x+d*Math.cos(an),ty=B.y+d*Math.sin(an);
  return `<line x1="${B.x}" y1="${B.y}" x2="${ex}" y2="${ey}" stroke="#14130f" stroke-width="12" stroke-linecap="round"/><line x1="${ex}" y1="${ey}" x2="${tx}" y2="${ty}" stroke="#ffc800" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 8"/><line x1="${ex}" y1="${ey}" x2="${tx}" y2="${ty}" stroke="#14130f" stroke-width="3"/><circle cx="${ex}" cy="${ey}" r="8" fill="#ffc800" stroke="#14130f" stroke-width="3"/><circle cx="${tx}" cy="${ty}" r="8" fill="#fff" stroke="#14130f" stroke-width="3"/>`}
function rules(c,lw){const has=(a,b)=>c.some(x=>(byId[x[0]].cls===a&&byId[x[1]].cls===b)||(byId[x[0]].cls===b&&byId[x[1]].cls===a));
  const lockOk=items.filter(i=>i.lock).every(i=>!pos[i.id]||pos[i.id][0]===0);
  const R=[['Bleach never beside ammonia or acid',has('ox','base')||has('ox','acid')],['Acids never beside bases',has('acid','base')],['Flammables apart from oxidizers',has('flam','ox')],['Corrosives and pods inside child lock',!lockOk]];
  $('rules').innerHTML=R.map(r=>`<li class="${r[1]?'bad':'ok'}"><span class="b">${r[1]?'!':'&#10003;'}</span>${r[0]}<span class="n">${r[1]?'FAIL':'PASS'}</span></li>`).join('')}
// arm motion
const slotXY=p=>({x:X0+p[1]*SW+SW/2,y:Y0+p[0]*(SH+10)+SH/2});
const trayXY=i=>({x:X0+30+i*54,y:Y0+2*(SH+10)+2});
function mv(x,y,ms){return new Promise(res=>{const sx=arm.x,sy=arm.y,t0=performance.now();(function f(n){if(stopped)return res(false);const k=Math.min(1,(n-t0)/ms),e=k*k*(3-2*k);arm.x=sx+(x-sx)*e;arm.y=sy+(y-sy)*e;if(floating){floating.x=arm.x;floating.y=arm.y-30}draw();k<1?requestAnimationFrame(f):res(true)})(t0)})}
async function sortRun(){if(stopped||busy||done)return;busy=true;$('sort').disabled=true;setArm('Sorting','');arm={x:300,y:250};
  const movers=items.filter(i=>pos[i.id][0]!==AFTER[i.id][0]||pos[i.id][1]!==AFTER[i.id][1]);
  log(movers.length+' items need to move. Using staging tray.');
  for(let i=0;i<movers.length;i++){const it=movers[i],p=slotXY(pos[it.id]);
    if(!await mv(p.x,p.y-10,420))return halt();floating={id:it.id,x:p.x,y:p.y};delete pos[it.id];log('Pick <b>'+it.name+'</b>');
    const t=trayXY(i);if(!await mv(t.x,t.y,420))return halt();pos[it.id]=null;floating=null;trayItems[it.id]=i;draw()}
  for(let i=0;i<movers.length;i++){const it=movers[i];const t=trayXY(i);
    if(!await mv(t.x,t.y,380))return halt();floating={id:it.id,x:t.x,y:t.y};delete trayItems[it.id];
    const p=slotXY(AFTER[it.id]);if(!await mv(p.x,p.y-10,460))return halt();pos[it.id]=AFTER[it.id].slice();floating=null;log('Place <b>'+it.name+'</b> in '+(AFTER[it.id][0]?'lower':'locked')+' bay '+(AFTER[it.id][1]+1));draw()}
  await mv(300,250,500);arm=null;done=true;busy=false;setArm('Verified','grn');
  $('aftitle').textContent='After';log('Camera verification: 0 conflicts. Dividers marked for install.');draw()}
const trayItems={};
function halt(){busy=false;floating=null;setArm('STOPPED','red');log('<b style="color:#d8312a">STOP</b> arm halted');draw();return false}
$('sort').onclick=sortRun;
$('reset').onclick=()=>{if(busy)return;pos=JSON.parse(JSON.stringify(BEFORE));walls=[];done=false;arm=null;floating=null;$('aftitle').textContent='Live view';$('sort').disabled=!scanned;setArm('Arm idle','grn');draw();log('Reset to original layout')};
$('stop').onclick=()=>{if(!stopped){stopped=true;$('stop').classList.add('latched');$('stop').textContent='RESET';setArm('STOPPED','red');log('<b style="color:#d8312a">STOP latched</b>')}else{stopped=false;$('stop').classList.remove('latched');$('stop').textContent='STOP';setArm('Arm idle','grn');busy=false;if(!done){pos=JSON.parse(JSON.stringify(BEFORE));for(const k in trayItems)delete trayItems[k];floating=null;arm=null;$('sort').disabled=!scanned}draw()}};
draw();log('Sorter ready. Mock arm connected.');
setTimeout(()=>{if(!scanned&&scanIdx<0)$('scan').click()},1200);
</script>
