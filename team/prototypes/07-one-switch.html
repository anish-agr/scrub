<!doctype html>
<!--
FEATURES:
- Single-switch scanning (auto-highlight, Space/Enter to select, adjustable speed, optional spoken options)
- Giant targets, 4 themes (calm, night, high-contrast yellow, high-contrast white), font size slider
- Point mode: camera view with huge labeled tappable boxes over detected items
- Voice mode: Web Speech API (typed fallback), live transcript, parsed intent chips (task=fetch target=phone)
- Dwell click / head-tilt simulation: hover ring timer, plus a tilt pad that drives a virtual cursor
- STOP: giant button, Escape, or ANY key held for 1 second (with visible hold ring); latches until RESET
- Arm progress as big plain words + progress ring; mock camera with 2-link arm animation
-->
<!--
SPONSORS: Perceptron Robotics (assistive fetch task, observable plan), Perceptron Perception (detections shown as targets),
Gemini API (intent parsing could replace the local parser), Photon (caregiver approval for risky items)
-->
<!--
BACKEND HOOKS: GET /api/state, POST /api/detect (items -> tiles/boxes), POST /api/say {text} (voice parse),
POST /api/request {task,target_id}, POST /api/confirm, POST /api/stop, POST /api/reset, WebSocket /ws (state, step, detections).
Runs fully in mock mode with no server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Switch Reach</title>
<meta name="description" content="An accessible control surface for a robot arm using one switch, pointing, voice, or head dwell.">
<style>
:root{
  --fs:20px;
  --bg:#eef3ef;--panel:#ffffff;--ink:#1d2b2a;--muted:#4f6360;--line:#c9d6d1;
  --accent:#2f6f73;--accent-ink:#ffffff;--ok:#2d7a4b;--danger:#b3261e;--hl:#ffd966;--hl-ink:#1d2b2a;--soft:#dde9e4;
}
[data-theme="night"]{--bg:#101a22;--panel:#18262f;--ink:#e8f1f2;--muted:#a3b8bd;--line:#2f4652;--accent:#6cc0c7;--accent-ink:#06161a;--ok:#6fd49a;--danger:#ff7b72;--hl:#f2c94c;--hl-ink:#101a22;--soft:#213540}
[data-theme="hcy"]{--bg:#000;--panel:#000;--ink:#ffe600;--muted:#fff3a0;--line:#ffe600;--accent:#ffe600;--accent-ink:#000;--ok:#39ff88;--danger:#ff5a4d;--hl:#00e5ff;--hl-ink:#000;--soft:#1a1a00}
[data-theme="hcw"]{--bg:#fff;--panel:#fff;--ink:#000;--muted:#222;--line:#000;--accent:#0030c0;--accent-ink:#fff;--ok:#006b2b;--danger:#b00000;--hl:#ffb000;--hl-ink:#000;--soft:#eee}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;line-height:1.35;min-height:100vh;padding-bottom:6rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.sr{position:absolute;left:-9999px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);display:flex;gap:.6rem;align-items:center;padding:.5rem .8rem;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;flex:1 1 8rem;font-weight:700}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.stop{min-height:3.4rem;min-width:9rem;border:4px solid #fff;outline:3px solid var(--danger);background:var(--danger);color:#fff;font-weight:800;font-size:1.5rem;border-radius:1rem;letter-spacing:.06em}
[data-theme="hcy"] .stop{background:#ff2a1a;border-color:#000}
.stop small{display:block;font-size:.55rem;font-weight:600;letter-spacing:0}
.gear{min-height:3.4rem;min-width:3.4rem;border:3px solid var(--line);background:var(--panel);border-radius:1rem;font-weight:700}
.tabs{display:flex;gap:.5rem;padding:.7rem .8rem;overflow-x:auto}
.tab{flex:1 0 auto;min-height:3rem;padding:.4rem 1rem;border:3px solid var(--line);background:var(--panel);border-radius:1rem;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{display:grid;gap:1rem;padding:0 .8rem;grid-template-columns:minmax(0,1fr);max-width:78rem;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:1.2rem;padding:1rem}
.panel h2{margin:0 0 .6rem;font-size:1rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
/* status */
.status{display:flex;gap:1rem;align-items:center}
.ring{width:7.5rem;height:7.5rem;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.3rem}
.word{font-size:2.2rem;font-weight:800;line-height:1.05;margin:0}
.sub{margin:.3rem 0 0;color:var(--muted);font-size:1rem}
.steps{display:flex;gap:.35rem;margin-top:.6rem;flex-wrap:wrap}
.steps i{height:.8rem;flex:1 0 2rem;border-radius:1rem;background:var(--soft)}
.steps i.on{background:var(--accent)}
.steps i.now{background:var(--hl);outline:2px solid var(--ink)}
[data-state="stopped"] .word{color:var(--danger)}
/* confirm */
.confirm{border:5px solid var(--accent);background:var(--panel);border-radius:1.2rem;padding:1rem;margin-bottom:1rem}
.confirm h3{margin:0;font-size:1.8rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.chip{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border:2px solid var(--line);border-radius:.6rem;padding:.2rem .6rem;font-size:.85rem}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.big{min-height:5rem;border:4px solid var(--line);border-radius:1.2rem;font-size:1.8rem;font-weight:800;background:var(--panel)}
.big.yes{background:var(--ok);color:#fff;border-color:var(--ok)}
[data-theme="hcy"] .big.yes{color:#000}
.big.no{background:var(--soft)}
.big.reset{background:var(--accent);color:var(--accent-ink);width:100%}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.8rem}
.tile{min-height:8rem;border:4px solid var(--line);background:var(--panel);border-radius:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-size:1.7rem;font-weight:800;padding:.6rem;position:relative}
.tile .sw{width:3.2rem;height:3.2rem;border-radius:30%;border:3px solid var(--ink)}
.scanning,.tile.scanning,.big.scanning{background:var(--hl)!important;color:var(--hl-ink)!important;border-color:var(--ink)!important;outline:6px solid var(--ink);outline-offset:2px;transform:scale(1.03)}
.hint{color:var(--muted);font-size:.9rem;margin:.6rem 0 0}
/* camera */
.cam{position:relative;width:100%;aspect-ratio:8/5;border-radius:1rem;overflow:hidden;border:3px solid var(--line);background:#222}
.cam canvas{width:100%;height:100%;display:block}
.cam .tag{position:absolute;left:.5rem;top:.5rem;background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;padding:.15rem .5rem;border-radius:.5rem}
.box{position:absolute;border:4px solid #fff;background:rgba(20,40,40,.28);border-radius:.8rem;color:#fff;font-weight:800;font-size:clamp(.95rem,3.4vw,1.7rem);display:flex;align-items:flex-end;justify-content:center;padding:.2rem;text-shadow:0 2px 4px #000;min-width:44px;min-height:44px}
.box span{background:rgba(0,0,0,.72);padding:.05rem .5rem;border-radius:.5rem}
.box:hover,.box:focus-visible{background:rgba(255,217,102,.45);border-color:var(--hl)}
.mini{max-width:100%}
/* voice */
.mic{min-height:5rem;width:100%;font-size:1.6rem;font-weight:800;border:4px solid var(--accent);border-radius:1.2rem;background:var(--accent);color:var(--accent-ink)}
.mic[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.transcript{min-height:4.5rem;border:3px dashed var(--line);border-radius:1rem;padding:.7rem;font-size:1.5rem;margin:.8rem 0}
.transcript em{color:var(--muted)}
input[type=text]{width:100%;min-height:3.2rem;font:inherit;padding:.4rem .8rem;border:3px solid var(--line);border-radius:.8rem;background:var(--panel);color:var(--ink)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.sm{min-height:3rem;padding:.3rem 1rem;border:3px solid var(--line);border-radius:.9rem;background:var(--panel);font-weight:700}
/* dwell */
.pad{position:relative;aspect-ratio:1;max-width:14rem;border:3px solid var(--line);border-radius:1.2rem;background:var(--soft);touch-action:none;cursor:crosshair}
.pad i{position:absolute;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);left:50%;top:50%;pointer-events:none}
.pad p{position:absolute;inset:auto 0 .4rem;text-align:center;margin:0;font-size:.75rem;color:var(--muted);pointer-events:none}
#cursor{position:fixed;z-index:60;width:4rem;height:4rem;margin:-2rem 0 0 -2rem;pointer-events:none;display:none}
#cursor svg{width:100%;height:100%;transform:rotate(-90deg)}
#cursor circle{fill:rgba(255,255,255,.2);stroke-width:7}
#cursor .a{stroke:var(--ink);opacity:.35}
#cursor .b{stroke:var(--accent);stroke-linecap:round}
/* hold ring */
#hold{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(0,0,0,.45)}
#hold div{background:var(--panel);border:5px solid var(--danger);border-radius:2rem;padding:1.2rem 2rem;text-align:center;font-weight:800;font-size:1.6rem}
#hold svg{width:9rem;height:9rem;transform:rotate(-90deg)}
#hold circle{fill:none;stroke-width:14}
/* latch */
.latch{background:var(--danger);color:#fff;border-radius:1.2rem;padding:1rem;margin-bottom:1rem}
.latch h3{margin:0 0 .6rem;font-size:1.8rem}
.latch .big{background:#fff;color:#000;border-color:#000}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(26rem,100%);background:var(--panel);border-left:4px solid var(--ink);z-index:90;padding:1rem;overflow:auto;transform:translateX(105%);transition:transform .25s}
#drawer.open{transform:none}
#drawer label{display:block;margin:1rem 0 .3rem;font-weight:700}
#drawer input[type=range]{width:100%;height:2.4rem}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.themes button{min-height:3rem;border:3px solid var(--line);border-radius:.8rem;background:var(--panel);font-weight:700}
.themes button[aria-pressed="true"]{outline:4px solid var(--accent)}
.chk{display:flex;gap:.6rem;align-items:center;min-height:2.8rem}
.chk input{width:1.6rem;height:1.6rem}
.log{font-size:.85rem;color:var(--muted);max-height:6rem;overflow:auto;margin:.6rem 0 0;padding-left:1rem}
@media(max-width:480px){.word{font-size:1.7rem}.ring{width:5.5rem;height:5.5rem}.tile{min-height:6.5rem;font-size:1.4rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-theme="calm">
<header>
  <h1>One Switch Reach<small>Mock arm. No server needed.</small></h1>
  <button class="gear" id="gear" aria-controls="drawer" aria-expanded="false">Settings</button>
  <button class="stop" id="stop" data-dwell>STOP<small>or hold any key 1 s</small></button>
</header>

<div class="tabs" role="tablist" aria-label="How do you want to choose">
  <button class="tab" role="tab" data-mode="scan" aria-selected="true">One switch</button>
  <button class="tab" role="tab" data-mode="point" aria-selected="false">Point</button>
  <button class="tab" role="tab" data-mode="voice" aria-selected="false">Voice</button>
  <button class="tab" role="tab" data-mode="dwell" aria-selected="false">Head dwell</button>
</div>

<main>
  <div>
    <div id="latch" class="latch" role="alert" hidden>
      <h3>STOPPED. The arm is safe.</h3>
      <button class="big reset" id="resetBtn" data-dwell>RESET</button>
    </div>
    <div id="confirm" class="confirm" hidden role="dialog" aria-label="Please confirm">
      <h3 id="cText">Fetch the phone?</h3>
      <div class="chips" id="cChips"></div>
      <div class="yn">
        <button class="big yes" id="yes" data-dwell>YES</button>
        <button class="big no" id="no" data-dwell>NO</button>
      </div>
    </div>
    <section class="panel" id="stage" aria-live="polite"></section>
  </div>
  <aside>
    <section class="panel" data-state="idle" id="statusPanel" aria-label="Arm status">
      <h2>Arm</h2>
      <div class="status">
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><b id="pct">0%</b></div>
        <div><p class="word" id="word">Ready</p><p class="sub" id="sub">Choose what you want.</p></div>
      </div>
      <div class="steps" id="steps" aria-hidden="true"></div>
    </section>
    <section class="panel" style="margin-top:1rem">
      <h2>What the arm sees</h2>
      <div class="cam mini"><canvas class="camv" width="640" height="400"></canvas><span class="tag">Mock camera</span></div>
      <ol class="log" id="log" aria-label="Recent events"></ol>
    </section>
  </aside>
</main>

<aside id="drawer" aria-label="Settings" aria-hidden="true">
  <button class="sm" id="closeDrawer">Close</button>
  <label>Text size <output id="fsOut"></output></label>
  <input type="range" id="fs" min="16" max="32" step="1">
  <label>Theme</label>
  <div class="themes" id="themes">
    <button data-t="calm">Calm light</button><button data-t="night">Night</button>
    <button data-t="hcy">Yellow on black</button><button data-t="hcw">Black on white</button>
  </div>
  <label>Scan speed: <output id="spOut"></output> s per option</label>
  <input type="range" id="speed" min="0.6" max="5" step="0.1">
  <label>Dwell time: <output id="dwOut"></output> s</label>
  <input type="range" id="dwell" min="0.6" max="3" step="0.1">
  <label class="chk"><input type="checkbox" id="speak"> Speak each option aloud</label>
  <label class="chk"><input type="checkbox" id="beep"> Soft click sound</label>
  <p class="hint">Space or Enter selects the highlighted option. Hold any key for 1 second to STOP.</p>
</aside>

<div id="hold" aria-hidden="true"><div><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="#ccc"/><circle id="holdFg" cx="60" cy="60" r="52" stroke="#e5352b" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><br>Keep holding to STOP</div></div>
<div id="cursor"><svg viewBox="0 0 80 80"><circle class="a" cx="40" cy="40" r="32"/><circle class="b" id="curFg" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="201"/></svg></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ITEMS=[
 {id:'phone',label:'Phone',color:'#3b5b8c',box:[.04,.06,.28,.3],syn:['phone','cell','mobile','telephone']},
 {id:'water',label:'Water',color:'#4aa8d8',box:[.36,.06,.28,.3],syn:['water','drink','cup','glass of water']},
 {id:'glasses',label:'Glasses',color:'#7a5a3a',box:[.68,.06,.28,.3],syn:['glasses','specs','spectacles']},
 {id:'keys',label:'Keys',color:'#c9a227',box:[.04,.4,.28,.3],syn:['keys','key']},
 {id:'remote',label:'Remote',color:'#333',box:[.36,.4,.28,.3],syn:['remote','clicker','tv remote']},
 {id:'blanket',label:'Blanket',color:'#b5546b',box:[.68,.4,.28,.3],syn:['blanket','throw']}
];
const TASKS={fetch:['get','bring','fetch','grab','pass','hand','give'],return:['return','put back','put away','take back']};
const STEPS=[['Looking',1500,'Finding it with the camera.'],['Reaching',2200,'Moving toward it.'],['Holding',1200,'Gripping gently.'],['Bringing',2400,'Carrying it to your tray.'],['Here it is',900,'Take it when you are ready.']];
const S={mode:'scan',state:'idle',latched:false,confirm:null,target:null,task:null,step:-1,prog:0,t0:0,
  settings:{fs:20,theme:'calm',speed:1.6,dwell:1.4,speak:false,beep:false},done:[]};
try{Object.assign(S.settings,JSON.parse(localStorage.getItem('os-settings')||'{}'))}catch(e){}

/* ---------- log / status ---------- */
function log(t){const li=document.createElement('li');li.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+'  '+t;const l=$('#log');l.prepend(li);while(l.children.length>6)l.lastChild.remove()}
function setStatus(word,sub,st){$('#word').textContent=word;$('#sub').textContent=sub;$('#statusPanel').dataset.state=st||S.state}
function setProg(p){S.prog=p;$('#fg').style.strokeDashoffset=326.7*(1-p);$('#pct').textContent=Math.round(p*100)+'%'}
function renderSteps(){$('#steps').innerHTML=STEPS.map((s,i)=>`<i class="${i<S.step?'on':i===S.step?'now':''}"></i>`).join('')}
function click(){if(!S.settings.beep)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.06)}catch(e){}}
function say(t){if(!S.settings.speak||!window.speechSynthesis)return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}

/* ---------- arm mock ---------- */
const item=id=>ITEMS.find(i=>i.id===id);
let raf=0;
function request(task,target){
  if(S.latched)return;
  if(S.state==='running')return;
  S.confirm={task,target};S.state='confirm';
  $('#cText').textContent=(task==='fetch'?'Fetch the ':'Put back the ')+item(target).label.toLowerCase()+'?';
  $('#cChips').innerHTML=`<span class="chip">task=${task}</span><span class="chip">target=${target}</span><span class="chip">box=[${item(target).box.map(n=>n.toFixed(2))}]</span>`;
  setStatus('Please confirm','Say YES or choose YES.','confirm');say($('#cText').textContent+' Yes or no');
  sync();
}
function answer(yes){
  if(!S.confirm)return;click();
  const c=S.confirm;S.confirm=null;
  if(!yes){S.state='idle';setStatus('Cancelled','Nothing moved.','idle');log('Cancelled '+c.target);sync();return}
  start(c.task,c.target);
}
function start(task,target){
  S.task=task;S.target=target;S.state='running';S.step=0;S.t0=performance.now();S.done=[];
  log('POST /api/request task='+task+' target='+target+' (mock)');
  setStatus(STEPS[0][0],STEPS[0][2],'running');renderSteps();setProg(0);sync();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
const TOTAL=STEPS.reduce((a,s)=>a+s[1],0);
function tick(now){
  if(S.state!=='running')return;
  const el=now-S.t0;let acc=0,idx=STEPS.length-1;
  for(let i=0;i<STEPS.length;i++){if(el<acc+STEPS[i][1]){idx=i;break}acc+=STEPS[i][1];if(i===STEPS.length-1)idx=STEPS.length}
  if(idx>=STEPS.length){finish();return}
  if(idx!==S.step){S.step=idx;setStatus(STEPS[idx][0],STEPS[idx][2],'running');renderSteps();say(STEPS[idx][0])}
  setProg(Math.min(1,el/TOTAL));
  raf=requestAnimationFrame(tick);
}
function finish(){S.state='done';S.step=STEPS.length;renderSteps();setProg(1);setStatus('Done','The '+item(S.target).label.toLowerCase()+' is on your tray.','done');log('Delivered '+S.target);say('Done');sync()}
function stop(){
  if(S.latched)return;
  S.latched=true;S.state='stopped';S.confirm=null;cancelAnimationFrame(raf);
  setStatus('STOPPED','The arm is locked. Choose RESET when ready.','stopped');log('POST /api/stop (latched)');say('Stopped');
  try{speechRecog&&speechRecog.abort()}catch(e){}
  sync();
}
function reset(){if(!S.latched)return;S.latched=false;S.state='idle';S.step=-1;setProg(0);renderSteps();S.target=null;setStatus('Ready','Choose what you want.','idle');log('POST /api/reset');sync()}

/* ---------- camera canvas ---------- */
const cams=$$('canvas.camv');
function armPose(){ // returns end effector position in 640x400 space and carried item
  const base=[590,380],home=[560,330];
  const ix=id=>{const b=item(id).box;return [(b[0]+b[2]/2)*640,(b[1]+b[3]/2)*400]};
  const tray=[90,350];
  let p=home,carry=null;
  if(S.state==='running'&&S.target){
    const t=ix(S.target);const el=(performance.now()-S.t0);let acc=0,u=0,i=0;
    for(;i<STEPS.length;i++){if(el<acc+STEPS[i][1]){u=(el-acc)/STEPS[i][1];break}acc+=STEPS[i][1]}
    const lerp=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
    if(i===0)p=lerp(home,[home[0]-40,home[1]-60],u);
    else if(i===1)p=lerp([home[0]-40,home[1]-60],t,u);
    else if(i===2){p=t;}
    else if(i===3){p=lerp(t,tray,u);carry=S.target}
    else{p=tray;carry=S.target}
  }else if(S.state==='done'&&S.target){p=[90,350];carry=S.target}
  return {base,p,carry};
}
function drawCam(){
  const t=performance.now()/1000,{base,p,carry}=armPose();
  cams.forEach(cv=>{
    const c=cv.getContext('2d'),W=640,H=400;
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cdbb9c');g.addColorStop(1,'#a58f6d');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(0,0,0,.07)';for(let x=0;x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
    // tray
    c.fillStyle='#6d5a43';c.fillRect(20,300,160,80);c.fillStyle='#e9dcc5';c.fillRect(28,308,144,64);
    c.fillStyle='#4b3b29';c.font='bold 14px sans-serif';c.fillText('YOUR TRAY',62,368);
    ITEMS.forEach(it=>{
      if(carry===it.id&&S.state!=='idle'){ }
      let cx=(it.box[0]+it.box[2]/2)*W,cy=(it.box[1]+it.box[3]/2)*H;
      if(carry===it.id)[cx,cy]=S.state==='done'?[100,342]:[p[0],p[1]+6];
      c.save();c.translate(cx,cy+Math.sin(t*1.3+it.box[0]*9)*.8);
      c.fillStyle=it.color;c.strokeStyle='#111';c.lineWidth=3;
      if(it.id==='phone'){rr(c,-18,-34,36,68,7)}
      else if(it.id==='water'){rr(c,-18,-30,36,60,8);c.fillStyle='rgba(255,255,255,.4)';c.fillRect(-12,-8,24,30)}
      else if(it.id==='glasses'){c.beginPath();c.arc(-18,0,15,0,7);c.arc(18,0,15,0,7);c.stroke();c.fillStyle='rgba(255,255,255,.25)';c.fill();c.fillRect(-4,-2,8,3)}
      else if(it.id==='keys'){c.beginPath();c.arc(-12,0,14,0,7);c.fill();c.stroke();c.fillRect(0,-4,34,8);c.strokeRect(0,-4,34,8)}
      else if(it.id==='remote'){rr(c,-14,-38,28,76,6);c.fillStyle='#e33';c.beginPath();c.arc(0,-24,5,0,7);c.fill()}
      else {rr(c,-36,-24,72,48,10);c.strokeStyle='rgba(255,255,255,.4)';c.beginPath();c.moveTo(-30,-8);c.lineTo(30,-8);c.moveTo(-30,8);c.lineTo(30,8);c.stroke()}
      c.restore();
    });
    // arm: 2 link IK
    const L1=250,L2=250;let dx=p[0]-base[0],dy=p[1]-base[1];let d=Math.min(Math.hypot(dx,dy),L1+L2-1);
    const a=Math.atan2(dy,dx),k=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
    const e=[base[0]+L1*Math.cos(a-k),base[1]+L1*Math.sin(a-k)];
    c.lineCap='round';c.strokeStyle='#2b2b2b';c.lineWidth=18;c.beginPath();c.moveTo(base[0],base[1]);c.lineTo(e[0],e[1]);c.lineTo(p[0],p[1]);c.stroke();
    c.strokeStyle=S.latched?'#e5352b':'#e8e8e8';c.lineWidth=6;c.beginPath();c.moveTo(base[0],base[1]);c.lineTo(e[0],e[1]);c.lineTo(p[0],p[1]);c.stroke();
    c.fillStyle='#111';c.beginPath();c.arc(p[0],p[1],11,0,7);c.fill();c.beginPath();c.arc(base[0],base[1],18,0,7);c.fill();
    if(S.latched){c.fillStyle='rgba(229,53,43,.18)';c.fillRect(0,0,W,H)}
  });
  requestAnimationFrame(drawCam);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();c.stroke()}

/* ---------- stage views ---------- */
function tilesHTML(){return `<div class="grid" id="grid">${ITEMS.map(i=>`<button class="tile" data-id="${i.id}" data-dwell><span class="sw" style="background:${i.color}"></span>${i.label}</button>`).join('')}</div>`}
function render(){
  const st=$('#stage');
  if(S.mode==='scan'){st.innerHTML=`<h2>One switch: press SPACE on the glowing choice</h2>${tilesHTML()}<p class="hint">The highlight moves by itself. Speed is in Settings. Currently ${S.settings.speed.toFixed(1)} s per choice.</p>`}
  else if(S.mode==='point'){st.innerHTML=`<h2>Point at what you want</h2><div class="cam"><canvas class="camv" width="640" height="400"></canvas><span class="tag">Live detections (mock)</span>${ITEMS.map(i=>`<button class="box" data-id="${i.id}" data-dwell style="left:${i.box[0]*100}%;top:${i.box[1]*100}%;width:${i.box[2]*100}%;height:${i.box[3]*100}%"><span>${i.label}</span></button>`).join('')}</div><p class="hint">Tap a big box. Each box is a detected object.</p>`}
  else if(S.mode==='voice'){st.innerHTML=`<h2>Say what you need</h2><button class="mic" id="mic" aria-pressed="false">Tap and speak</button><div class="transcript" id="tx" aria-live="polite"><em>Your words appear here as you speak.</em></div><form id="tf"><label class="sr" for="ti">Type instead</label><input type="text" id="ti" placeholder="Type: fetch the phone" autocomplete="off"><div class="row"><button class="sm" type="submit">Send</button></div></form><div class="row" id="ph">${['Fetch the phone','Bring me water','Get my glasses','Put back the keys'].map(p=>`<button class="sm" data-p="${p}">${p}</button>`).join('')}</div><p class="hint" id="vhint"></p>`;bindVoice()}
  else {st.innerHTML=`<h2>Head dwell: rest on a choice until the ring fills</h2>${tilesHTML()}<div class="row" style="align-items:center"><div class="pad" id="pad" aria-label="Head tilt simulator"><i id="padDot"></i><p>Head tilt pad: move the pointer here</p></div><p class="hint" style="flex:1 1 10rem">Simulates a head tracker. Moving in the pad drives the big cursor across the whole screen. Dwell ${S.settings.dwell.toFixed(1)} s to click.</p></div>`;bindPad()}
  $$('#stage canvas.camv').forEach(x=>{if(!cams.includes(x))cams.push(x)});
  for(let i=cams.length-1;i>=0;i--)if(!document.body.contains(cams[i]))cams.splice(i,1);
  $$('#stage [data-id]').forEach(b=>b.addEventListener('click',()=>{click();request('fetch',b.dataset.id)}));
  sync();
}
function sync(){
  $('#latch').hidden=!S.latched;$('#confirm').hidden=!S.confirm;
  $('#stage').style.opacity=S.latched?.45:1;
  $$('#stage button,#stage input').forEach(b=>{b.disabled=S.latched||S.state==='running'||!!S.confirm});
  scanIdx=-1;clearScan();
  $('#cursor').style.display=S.mode==='dwell'||S.dwellAny?'block':'none';
}

/* ---------- scanning ---------- */
let scanIdx=-1,scanT=0;
function targets(){
  if(S.latched)return [$('#resetBtn')];
  if(S.confirm)return [$('#yes'),$('#no')];
  if(S.mode==='scan'&&S.state!=='running')return $$('#grid .tile');
  if(S.mode==='scan'&&S.state==='done')return $$('#grid .tile');
  return [];
}
function clearScan(){$$('.scanning').forEach(e=>e.classList.remove('scanning'))}
function scanStep(){
  clearScan();const t=targets();if(S.mode!=='scan'&&!S.latched&&!S.confirm)return;
  if(!t.length)return;
  scanIdx=(scanIdx+1)%t.length;t[scanIdx].classList.add('scanning');click();
  say(t[scanIdx].textContent.replace('STOP','').trim());
}
function restartScan(){clearInterval(scanT);scanT=setInterval(scanStep,S.settings.speed*1000)}
function selectScan(){
  const t=targets();if(!t.length||scanIdx<0)return;
  const el=t[scanIdx];if(el&&el.classList.contains('scanning')){clearScan();el.click();scanIdx=-1}
}

/* ---------- STOP: any key held 1s ---------- */
const held={};let holdRAF=0;
function isTyping(e){const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){stop();return}
  if(isTyping(e))return;
  if(e.repeat){if(S.mode==='scan'&&(e.code==='Space'||e.key==='Enter'))e.preventDefault();return}
  if(S.mode==='scan'&&(e.code==='Space'||e.key==='Enter'))e.preventDefault();
  held[e.code]=performance.now();
  if(!holdRAF)holdRAF=requestAnimationFrame(holdTick);
});
document.addEventListener('keyup',e=>{
  const t0=held[e.code];delete held[e.code];
  if(t0&&performance.now()-t0<1000&&(e.code==='Space'||e.key==='Enter')&&S.mode==='scan')selectScan();
  if(!Object.keys(held).length)$('#hold').style.display='none';
});
window.addEventListener('blur',()=>{for(const k in held)delete held[k];$('#hold').style.display='none'});
function holdTick(){
  const now=performance.now(),ts=Object.values(held);
  if(!ts.length){holdRAF=0;$('#hold').style.display='none';return}
  const el=now-Math.min(...ts);
  if(el>250){$('#hold').style.display='grid';$('#holdFg').style.strokeDashoffset=326.7*(1-Math.min(1,el/1000))}
  if(el>=1000){for(const k in held)delete held[k];$('#hold').style.display='none';stop();holdRAF=0;return}
  holdRAF=requestAnimationFrame(holdTick);
}

/* ---------- voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let speechRecog=null;
function parse(text){
  const t=' '+text.toLowerCase().replace(/[^a-z ]/g,' ')+' ';
  if(/\b(stop|halt|emergency)\b/.test(t))return {task:'stop'};
  let task=null;
  for(const k in TASKS)if(TASKS[k].some(w=>t.includes(' '+w+' ')))task=k;
  let target=null;
  for(const it of ITEMS)if(it.syn.some(w=>t.includes(' '+w+' ')||t.includes(' '+w+'s ')))target=it.id;
  return {task:task||(target?'fetch':null),target};
}
function showTx(final,interim){const el=$('#tx');if(el)el.innerHTML=(final?`<strong>${esc(final)}</strong>`:'')+(interim?` <em>${esc(interim)}</em>`:'')||'<em>Listening...</em>'}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function handleText(text){
  showTx(text,'');const r=parse(text);log('POST /api/say "'+text+'"');
  if(r.task==='stop'){stop();return}
  if(r.task&&r.target)request(r.task,r.target);
  else $('#vhint').textContent='I understood task='+(r.task||'?')+' target='+(r.target||'?')+'. Try "fetch the phone".';
}
function bindVoice(){
  const mic=$('#mic');
  if(!SR){mic.textContent='Mic not available here. Type or tap a phrase.';mic.disabled=true;$('#vhint').textContent='Speech recognition is not supported in this browser. Typing and phrase buttons still work.'}
  mic.onclick=()=>{
    if(!SR)return;
    if(speechRecog){try{speechRecog.stop()}catch(e){}return}
    const r=speechRecog=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;
    let fin='';
    r.onstart=()=>{mic.setAttribute('aria-pressed','true');mic.textContent='Listening... tap to stop';showTx('','')};
    r.onresult=ev=>{let it='';fin='';for(const res of ev.results){if(res.isFinal)fin+=res[0].transcript;else it+=res[0].transcript}showTx(fin,it)};
    r.onerror=()=>{$('#vhint').textContent='Could not hear. Try typing.'};
    r.onend=()=>{speechRecog=null;mic.setAttribute('aria-pressed','false');mic.textContent='Tap and speak';if(fin.trim())handleText(fin)};
    try{r.start()}catch(e){speechRecog=null}
  };
  $('#tf').onsubmit=e=>{e.preventDefault();const v=$('#ti').value.trim();if(v){handleText(v);$('#ti').value=''}};
  $$('#ph [data-p]').forEach(b=>b.onclick=()=>handleText(b.dataset.p));
  if(!SR){}
}

/* ---------- dwell / head tilt ---------- */
const cur={x:innerWidth/2,y:innerHeight/2};let dEl=null,dT=0,dCool=false;
document.addEventListener('pointermove',e=>{if(e.target.closest&&e.target.closest('#pad'))return;cur.x=e.clientX;cur.y=e.clientY});
function bindPad(){
  const pad=$('#pad'),dot=$('#padDot');
  pad.addEventListener('pointermove',e=>{
    const r=pad.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
    dot.style.left=fx*100+'%';dot.style.top=fy*100+'%';cur.x=fx*innerWidth;cur.y=fy*innerHeight;
  });
}
function dwellLoop(now){
  const cv=$('#cursor');
  if(S.mode==='dwell'){
    cv.style.display='block';cv.style.left=cur.x+'px';cv.style.top=cur.y+'px';
    const el=document.elementFromPoint(cur.x,cur.y),b=el&&el.closest('[data-dwell]');
    if(b&&!b.disabled){
      if(b!==dEl){dEl=b;dT=now;dCool=false}
      const p=dCool?0:Math.min(1,(now-dT)/(S.settings.dwell*1000));
      $('#curFg').style.strokeDashoffset=201*(1-p);
      if(p>=1&&!dCool){dCool=true;click();b.click();dT=now}
    }else{dEl=null;$('#curFg').style.strokeDashoffset=201}
  }else cv.style.display='none';
  requestAnimationFrame(dwellLoop);
}

/* ---------- settings ---------- */
function applySettings(){
  const s=S.settings;document.documentElement.style.setProperty('--fs',s.fs+'px');document.body.dataset.theme=s.theme;
  $('#fs').value=s.fs;$('#fsOut').textContent=s.fs+'px';$('#speed').value=s.speed;$('#spOut').textContent=(+s.speed).toFixed(1);
  $('#dwell').value=s.dwell;$('#dwOut').textContent=(+s.dwell).toFixed(1);$('#speak').checked=s.speak;$('#beep').checked=s.beep;
  $$('#themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===s.theme));
  try{localStorage.setItem('os-settings',JSON.stringify(s))}catch(e){}
  restartScan();
}
$('#fs').oninput=e=>{S.settings.fs=+e.target.value;applySettings()};
$('#speed').oninput=e=>{S.settings.speed=+e.target.value;applySettings()};
$('#dwell').oninput=e=>{S.settings.dwell=+e.target.value;applySettings()};
$('#speak').onchange=e=>{S.settings.speak=e.target.checked;applySettings()};
$('#beep').onchange=e=>{S.settings.beep=e.target.checked;applySettings()};
$$('#themes button').forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.t;applySettings()});
function drawer(o){$('#drawer').classList.toggle('open',o);$('#drawer').setAttribute('aria-hidden',!o);$('#gear').setAttribute('aria-expanded',o);if(o)$('#closeDrawer').focus()}
$('#gear').onclick=()=>drawer(!$('#drawer').classList.contains('open'));
$('#closeDrawer').onclick=()=>drawer(false);

/* ---------- wiring ---------- */
$('#stop').onclick=stop;
$('#resetBtn').onclick=reset;
$('#yes').onclick=()=>answer(true);
$('#no').onclick=()=>answer(false);
$$('.tab').forEach(t=>t.onclick=()=>{
  S.mode=t.dataset.mode;$$('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));render();
  if(S.state==='done'){S.state='idle';setStatus('Ready','Choose what you want.','idle');setProg(0);S.step=-1;renderSteps();S.target=null}
});
// after a delivery, tiles unlock again
setInterval(()=>{if(S.state==='done'&&!S.confirm){ $$('#stage button,#stage input').forEach(b=>b.disabled=false)}},300);
const origSync=sync;
applySettings();renderSteps();render();
log('Mock arm ready. Hold any key 1 s to STOP.');
requestAnimationFrame(drawCam);requestAnimationFrame(dwellLoop);
// live feel: gentle detection confidence log
setInterval(()=>{if(S.state==='idle'&&!S.latched)log('POST /api/detect -> 6 items, avg conf '+(0.92+Math.random()*.06).toFixed(2))},9000);
})();
</script>
</body>
