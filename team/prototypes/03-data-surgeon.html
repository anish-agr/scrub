<!DOCTYPE html>
<!--
FEATURES:
- Grid of 40 mock LeRobot episodes with canvas-drawn thumbnail strips, duration, success flag, quality score
- Episode detail: synchronized fake overhead video, scrubber, 6 joint trajectory plots, gripper state band
- Auto-detected problems (jerk spikes, idle start/end, gripper chatter, camera dropout, out-of-distribution pose) as colored timeline markers (detection runs on the actual mock data)
- One-click Trim idle, Drop episode, Relabel (success flag + instruction), all recompute scores live
- Gemini-style auto instruction with paraphrases, regenerate and pick-as-label
- Dataset health dashboard: object start-position heatmap, success rate, length histogram, coverage recommendation
- Export to Hugging Face Hub with fake multi-stage push progress
-->
<!-- SPONSORS: Perceptron Robotics (data for fine-tuning), Gemini API (instruction + paraphrase generation), Tiger Data (time-series episode telemetry), MongoDB Atlas (episode metadata), Backboard (dataset memory/recommendations) -->
<!-- BACKEND HOOKS: GET /api/datasets/{id}/episodes ; GET /api/episodes/{n}/frames?cam=top ; GET /api/episodes/{n}/telemetry (Tiger Data hypertable) ; POST /api/episodes/{n}/trim {start,end} ; POST /api/episodes/{n}/drop ; PATCH /api/episodes/{n} {success,instruction} ; POST /api/gemini/instructions {episode} ; GET /api/datasets/{id}/coverage ; POST /api/datasets/{id}/push {repo_id} (SSE progress) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode Studio</title>
<meta name="description" content="A LeRobot dataset doctor that finds, fixes and explains bad robot demonstration episodes before you fine-tune.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --sub:#f7f7f5; --line:#e9e9e7; --line2:#dcdcd8; --ink:#2f2f2c; --mute:#787774; --faint:#a9a8a3;
  --accent:#2f6fed; --accent-bg:#e8f0fe; --ok:#1f9d6b; --ok-bg:#e6f6ef; --bad:#d9433f; --bad-bg:#fdecec;
  --warn:#c77d0a; --warn-bg:#fdf3e1;
  --jerk:#e5484d; --idle:#f5a524; --chat:#8e4ec6; --drop:#3e63dd; --ood:#d6409f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-weight:600}
.logo{width:26px;height:26px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}
.crumb small{color:var(--mute);font-weight:400}
.sp{flex:1}
.tabs{display:flex;gap:2px;padding:0 16px}
.tab{border:0;background:none;padding:10px 12px;min-height:44px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--ink)}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line2);background:#fff;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.btn:hover{background:var(--sub)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#2459c9}
.btn.dng{color:var(--bad)}
.btn.dng:hover{background:var(--bad-bg)}
.btn.sm{min-height:44px;font-size:13px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sub);font-size:12px;color:var(--mute)}
.kpi b{color:var(--ink);font-weight:600;margin-left:4px}
main{padding:0}
.view{display:none}.view.on{display:block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 620px;align-items:start}
.left{padding:16px 20px;min-width:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:#fff;font-size:13px;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select{min-height:44px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s;position:relative}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.card.dropped{opacity:.45}
.card canvas{display:block;width:100%;height:auto;background:#222}
.cb{padding:8px 10px 10px}
.row{display:flex;align-items:center;gap:6px}
.ttl{font-weight:600}
.meta{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.gray{background:var(--sub);color:var(--mute)}
.q{margin-left:auto;font-weight:700;font-size:13px}
.dots{display:flex;gap:3px;margin-top:6px;min-height:8px}
.dots i{width:8px;height:8px;border-radius:50%}
.detail{position:sticky;top:96px;max-height:calc(100vh - 96px);overflow:auto;border-left:1px solid var(--line);background:var(--bg);padding:16px 20px 40px}
.detail h2{margin:0;font-size:20px}
.empty{color:var(--mute);padding:60px 10px;text-align:center}
.closeD{display:none}
.vid{position:relative;border-radius:10px;overflow:hidden;background:#111;margin:12px 0 8px}
.vid canvas{display:block;width:100%;height:auto}
.ctrl{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tracks{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 8px;background:#fff;cursor:ew-resize;touch-action:none;user-select:none}
.tr{display:flex;align-items:center;height:46px;border-bottom:1px dashed var(--line)}
.tr:last-of-type{border-bottom:0}
.tr .lb{width:84px;flex:none;font-size:11px;color:var(--mute);line-height:1.2}
.tr .lb b{display:block;color:var(--ink);font-weight:600}
.tr canvas{flex:1;height:100%;min-width:0;display:block}
.lane{position:relative;flex:1;height:22px;background:var(--sub);border-radius:5px;min-width:0;overflow:hidden}
.lane .mk{position:absolute;top:0;bottom:0;min-width:4px;border-radius:3px;opacity:.9}
.lane .gc{position:absolute;top:5px;bottom:5px;background:var(--ink);border-radius:3px;opacity:.75}
.trl{height:30px}
.ph{position:absolute;top:4px;bottom:4px;width:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 0 1px #fff}
.ph::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px;font-weight:600}
.issue{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;min-height:44px}
.issue:hover{background:var(--sub)}
.issue i{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.issue b{font-weight:600}
.issue span{color:var(--mute);font-size:12px;display:block}
.issue .t{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.instr{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sub)}
.instr .main{font-size:15px;font-weight:500}
.gem{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:600}
.para{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.para button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;min-height:44px}
.para button:hover{border-color:var(--accent);background:var(--accent-bg)}
.shim{animation:shim 1s infinite}
@keyframes shim{50%{opacity:.35}}
.dash{padding:20px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px;max-width:1200px;margin:0 auto}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;min-width:0}
.panel h4{margin:0 0 4px;font-size:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c12{grid-column:span 12}
.rec{background:var(--accent-bg);border-color:#c9dafc}
.rec .big{font-size:20px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:12px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:2px;transition:height .4s}
.bars span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
.bl{display:flex;gap:6px}.bl div{flex:1;text-align:center;font-size:11px;color:var(--mute);margin-top:4px}
.hm{display:block;width:100%;height:auto;border-radius:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.meter{height:8px;background:var(--sub);border-radius:99px;overflow:hidden;margin-top:10px}
.meter div{height:100%;background:var(--ok);transition:width .5s}
.modal{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:14px;padding:22px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{margin:0 0 4px}
.prog{height:10px;background:var(--sub);border-radius:99px;overflow:hidden;margin:14px 0 10px}
.prog div{height:100%;width:0;background:linear-gradient(90deg,#2f6fed,#7a5af8);transition:width .2s}
.log{background:#17171a;color:#c8f7dc;border-radius:8px;padding:10px;height:150px;overflow:auto;font-size:12px}
input.txt{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;font:inherit}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;top:0;max-height:none;z-index:40;transform:translateY(100%);transition:transform .25s;border:0}
  .detail.open{transform:none}
  .closeD{display:inline-flex}
  .c3,.c4,.c5,.c6,.c7{grid-column:span 12}
}
@media(max-width:520px){
  .top .btn{padding:0 10px;font-size:13px}
  .top{padding:8px 12px}.left{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tr .lb{width:62px;font-size:10px}.kpis{display:none}.dash{padding:12px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="crumb"><div class="logo">E</div>Episode Studio <small>/ so101-pick-mug-v2</small></div>
    <div class="kpis" id="kpis"></div>
    <div class="sp"></div>
    <button class="btn" id="btnRescan">Rescan dataset</button>
    <button class="btn pri" id="btnExport">Push to Hub</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-v="eps">Episodes</button>
    <button class="tab" data-v="health">Dataset health</button>
  </div>
</header>

<main>
<section class="view on" id="v-eps">
  <div class="layout">
    <div class="left">
      <div class="bar" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="detail" id="detail"></aside>
  </div>
</section>
<section class="view" id="v-health"><div class="dash" id="dash"></div></section>
</main>

<div class="modal" id="exportM"><div class="mbox">
  <h2>Push to Hugging Face Hub</h2>
  <div class="meta" style="margin-bottom:10px">Only kept episodes are exported. Dropped episodes are excluded and indices are re-packed.</div>
  <input class="txt mono" id="repo" value="uw-robotics/so101-pick-mug-v2" aria-label="Repo id">
  <div class="prog"><div id="pbar"></div></div>
  <div class="row"><b id="pst">Ready</b><span class="meta" id="ppc" style="margin-left:auto"></span></div>
  <div class="log mono" id="plog" style="margin-top:10px"></div>
  <div class="actions" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" id="pclose">Close</button><button class="btn pri" id="pgo">Start push</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const sstep=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}
const JN=[["shoulder_pan","deg"],["shoulder_lift","deg"],["elbow_flex","deg"],["wrist_flex","deg"],["wrist_roll","deg"],["gripper","pct"]];
const LIM=[[-75,75],[-95,95],[-100,135],[-80,80],[-45,45],[-5,60]];
const TYPE={jerk:{c:"#e5484d",n:"Jerk spike"},idle:{c:"#f5a524",n:"Idle frames"},chatter:{c:"#8e4ec6",n:"Gripper chatter"},dropout:{c:"#3e63dd",n:"Camera dropout"},ood:{c:"#d6409f",n:"Out-of-distribution pose"}};
const OBJ=[["red","mug","#d9433f"],["blue","cup","#2f6fed"],["green","bowl","#1f9d6b"],["yellow","mug","#e8b020"]];
const HOME={x:.5,y:.95},TRAY={x:.5,y:.13};
const HZ=10;

/* ---------- episode generation ---------- */
function genEp(i){
  const r=rng(i*977+13), g=()=>(r()+r()+r()-1.5)*2/1.5;
  const dur=i===7?44:i===19?6.5:9+r()*20+(r()<.15?10:0);
  let N=Math.round(dur*HZ);
  const ox=.1+.82*Math.pow(r(),.62), oy=.38+.45*r();
  const o=OBJ[Math.floor(r()*OBJ.length)];
  const idleS=r()<.2?Math.round((1.5+r()*2.5)*HZ):3, idleE=r()<.2?Math.round((1.5+r()*2.5)*HZ):3;
  const body=N-idleS-idleE;
  const W=[3,1,1,1,3,1,1,3],tot=W.reduce((a,b)=>a+b);
  const K=[[ox,oy,.25,1],[ox,oy,0,1],[ox,oy,0,0],[ox,oy,.3,0],[TRAY.x+.04*g(),TRAY.y,.3,0],[TRAY.x,TRAY.y,.05,0],[TRAY.x,TRAY.y,.05,1],[HOME.x,HOME.y,.3,1]];
  const x=[],y=[],z=[],gr=[];
  let prev=[HOME.x,HOME.y,.3,1];const segEnd=[];let acc=idleS;
  const tl=[];
  for(let k=0;k<K.length;k++){const a=acc,b=acc+body*W[k]/tot;tl.push([a,b,prev,K[k]]);prev=K[k];acc=b}
  const rollT=(r()-.5)*40;
  for(let n=0;n<N;n++){
    let p=null;
    if(n<idleS)p=[HOME.x,HOME.y,.3,1];
    else if(n>=acc)p=[HOME.x,HOME.y,.3,1];
    else for(const s of tl){if(n>=s[0]&&n<s[1]){const u=sstep((n-s[0])/(s[1]-s[0]));p=s[2].map((v,j)=>lerp(v,s[3][j],u));break}}
    x.push(p[0]);y.push(p[1]);z.push(p[2]);gr.push(p[3]);
  }
  const grasp=tl[2];const gs=Math.round(grasp[0]);
  /* chatter */
  if(r()<.17){for(let k=0;k<14;k++)gr[Math.min(N-1,gs-3+k)]=k%2?0:1}
  const J=[[],[],[],[],[],[]];
  for(let n=0;n<N;n++){
    const dx=(x[n]-.5)*1.1,dy=1.08-y[n],rr=Math.hypot(dx,dy);
    const pan=Math.atan2(dx,dy)*57.3, lift=-70+rr*125-z[n]*35, elb=105-rr*100+z[n]*25, wf=25-z[n]*45-rr*18;
    const gc=1-gr[n];
    J[0].push(pan+g()*.06);J[1].push(lift+g()*.06);J[2].push(elb+g()*.06);J[3].push(wf+g()*.06);
    J[4].push(rollT*gc+3*Math.sin(n/9)*0+g()*.06);J[5].push(gr[n]*40+g()*.08);
  }
  /* smooth gripper jumps from chatter keep sharp, fine */
  /* glitches */
  if(r()<.14){const nn=1+Math.floor(r()*3);for(let q=0;q<nn;q++){const j=Math.floor(r()*5),at=idleS+4+Math.floor(r()*(body-8));J[j][at]+=(r()<.5?1:-1)*(22+r()*14)}}
  if(r()<.12){const j=4,L=10,at=idleS+Math.floor(r()*(body-L));for(let k=0;k<L;k++)J[j][at+k]+=62*Math.sin(Math.PI*k/(L-1))}
  const cam=new Array(N).fill(true);
  if(r()<.15){const L=Math.round((1+r()*1.5)*HZ),at=Math.floor(r()*(N-L));for(let k=0;k<L;k++)cam[at+k]=false}
  const success=r()>.26;
  return {id:i,obj:o,ox,oy,N,success,J,x,y,z,gr,cam,dropAt:Math.round(lerp(tl[4][0],tl[4][1],.55)),dropped:false,trimmed:false,
    instr:null,para:null,seed:i};
}
/* ---------- detection ---------- */
function runs(arr,min){const out=[];let s=-1;for(let i=0;i<=arr.length;i++){if(i<arr.length&&arr[i]){if(s<0)s=i}else if(s>=0){if(i-s>=min)out.push([s,i-1]);s=-1}}return out}
function detect(e){
  const N=e.N,is=[];
  /* jerk */
  const jk=new Array(N).fill(-1);
  for(let j=0;j<5;j++)for(let i=1;i<N-1;i++){const d=Math.abs(e.J[j][i+1]-2*e.J[j][i]+e.J[j][i-1]);if(d>9)jk[i]=j}
  let last=-9;for(let i=0;i<N;i++)if(jk[i]>=0){if(i-last>3)is.push({type:"jerk",a:i,b:i,j:jk[i],label:`${JN[jk[i]][0]} spike`,detail:"Second derivative exceeds 9 deg/step^2"});last=i}
  /* idle */
  const sp=[];for(let i=0;i<N;i++){let s=0;if(i>0)for(let j=0;j<5;j++)s+=Math.abs(e.J[j][i]-e.J[j][i-1]);sp.push(s)}
  let a=0;while(a<N&&sp[a]<.9)a++;
  if(a>=12)is.push({type:"idle",a:0,b:a-1,label:"Idle at start",detail:`${(a/HZ).toFixed(1)}s with no joint motion`,edge:"s"});
  let b=N-1;while(b>0&&sp[b]<.9)b--;
  if(N-1-b>=12)is.push({type:"idle",a:b+1,b:N-1,label:"Idle at end",detail:`${((N-1-b)/HZ).toFixed(1)}s with no joint motion`,edge:"e"});
  /* chatter */
  const st=e.J[5].map(v=>v>20?1:0);const tg=st.map((v,i)=>i&&v!==st[i-1]?1:0);
  for(let i=0;i<N-14;i++){let c=0;for(let k=0;k<15;k++)c+=tg[i+k];if(c>=4){is.push({type:"chatter",a:i,b:i+14,label:"Gripper chatter",detail:`${c} open/close toggles in 1.5s`});i+=15}}
  /* dropout */
  runs(e.cam.map(v=>!v),3).forEach(([p,q])=>is.push({type:"dropout",a:p,b:q,label:"Camera dropout",detail:`${((q-p+1)/HZ).toFixed(1)}s of missing frames on cam_top`}));
  /* ood */
  const ood=new Array(N).fill(false),who=new Array(N).fill(0);
  for(let i=0;i<N;i++)for(let j=0;j<6;j++)if(e.J[j][i]<LIM[j][0]||e.J[j][i]>LIM[j][1]){ood[i]=true;who[i]=j}
  runs(ood,4).forEach(([p,q])=>is.push({type:"ood",a:p,b:q,j:who[p],label:"Out-of-distribution pose",detail:`${JN[who[p]][0]} outside training range ${LIM[who[p]][0]}..${LIM[who[p]][1]}`}));
  return is.sort((p,q)=>p.a-q.a);
}
function score(e){
  const c={};e.issues.forEach(x=>c[x.type]=(c[x.type]||0)+1);
  let p=Math.min(18,(c.jerk||0)*6)+(c.idle||0)*8+(c.chatter?15:0)+(c.dropout?14:0)+(c.ood?18:0)+(e.success?0:10);
  return Math.max(5,100-p);
}

function makeText(e,reroll){

  const pp=[];while(pp.length<4){const x=pick(P);if(!pp.includes(x))pp.push(x)}

/* ---------- scene drawing ---------- */
function drawScene(ctx,w,h,e,n,mini){
  n=Math.max(0,Math.min(e.N-1,Math.round(n)));
  ctx.save();ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#b99a73");g.addColorStop(1,"#a1845f");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  /* wood grain */
  ctx.strokeStyle="rgba(80,55,30,.12)";ctx.lineWidth=1;for(let k=0;k<h;k+=Math.max(5,h/16)){ctx.beginPath();ctx.moveTo(0,k);ctx.lineTo(w,k+2);ctx.stroke()}
  const X=v=>v*w,Y=v=>v*h;
  /* tray */
  ctx.fillStyle="#e9e7e1";ctx.strokeStyle="#8d8a82";ctx.lineWidth=Math.max(1,w/120);
  ctx.beginPath();ctx.roundRect(X(TRAY.x)-w*.14,Y(TRAY.y)-h*.1,w*.28,h*.2,w*.02);ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(0,0,0,.06)";ctx.fillRect(X(TRAY.x)-w*.11,Y(TRAY.y)-h*.07,w*.22,h*.14);
  if(!e.cam[n]){
    for(let k=0;k<(mini?200:900);k++){const v=Math.random()*255|0;ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.fillRect(Math.random()*w,Math.random()*h,w/40+1,h/30+1)}
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,w,h);ctx.fillStyle="#fff";ctx.font=`600 ${Math.max(8,h/12)}px Inter`;ctx.textAlign="center";ctx.fillText("NO SIGNAL",w/2,h/2);ctx.restore();return}
  /* object */
  const ex=e.x[n],ey=e.y[n],ez=e.z[n],gc=e.gr[n];
  const fc=e.firstClose(),rl=e.releaseIdx();
  let ox=e.ox,oy=e.oy;
  if(n>=fc){
    if(e.gr[n]<.5&&n<rl&&(e.success||n<e.dropAt)){ox=ex;oy=ey}
    else if(!e.success&&n>=e.dropAt){const d=Math.min(e.N-1,e.dropAt);ox=e.x[d];oy=e.y[d]+.08}
    else if(e.success&&n>=rl){ox=TRAY.x;oy=TRAY.y}
  }
  const orad=Math.min(w,h)*.055;
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(X(ox)+3,Y(oy)+4,orad,orad*.9,0,0,7);ctx.fill();
  ctx.fillStyle=e.obj[2];ctx.beginPath();ctx.arc(X(ox),Y(oy),orad,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.arc(X(ox)-orad*.25,Y(oy)-orad*.25,orad*.45,0,7);ctx.fill();
  ctx.strokeStyle=e.obj[2];ctx.lineWidth=orad*.3;ctx.beginPath();ctx.arc(X(ox)+orad*1.05,Y(oy),orad*.45,-1.2,1.2);ctx.stroke();
  /* arm */
  const bx=X(HOME.x),by=Y(1.02),tx=X(ex),ty=Y(ey);
  const mx=(bx+tx)/2,my=(by+ty)/2,d=Math.hypot(tx-bx,ty-by)||1,LL=d/2+w*.1,off=Math.sqrt(Math.max(0,LL*LL-d*d/4))*(ex<.5?-1:1);
  const px=mx+(-(ty-by)/d)*off*-1,py=my+((tx-bx)/d)*off*-1;
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=w*.04;ctx.beginPath();ctx.moveTo(bx+4,by+5);ctx.lineTo(px+4,py+5);ctx.lineTo(tx+4,ty+5);ctx.stroke();
  ctx.strokeStyle="#f2f2f0";ctx.lineWidth=w*.036;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(px,py);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.strokeStyle="#2f2f2c";ctx.lineWidth=w*.012;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(px,py);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.fillStyle="#2f2f2c";ctx.beginPath();ctx.arc(px,py,w*.016,0,7);ctx.fill();
  const jaw=lerp(.012,.034,gc)*w,sc=1+ez*.25;
  ctx.fillStyle="#e5484d";ctx.beginPath();ctx.arc(tx,ty,w*.026*sc,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillRect(tx-jaw-2,ty-w*.03,3,w*.02);ctx.fillRect(tx+jaw-1,ty-w*.03,3,w*.02);
  /* HUD */
  if(!mini){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(8,8,w*.3,h*.1);ctx.fillStyle="#fff";ctx.font=`${Math.max(9,h*.05)}px JetBrains Mono`;ctx.textAlign="left";ctx.fillText(`cam_top  t=${(n/HZ).toFixed(1)}s  f${n*3}`,14,8+h*.07)}
  ctx.restore();
}
/* helpers cached on episode */

let speed=1;
function drawPlots(){
  const e=sel;if(!e)return;
  document.querySelectorAll("#tracks canvas").forEach(cv=>{
    const j=+cv.dataset.j,dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
    cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);
    const [lo,hi]=LIM[j],yv=v=>h-3-(v-lo)/(hi-lo)*(h-6),xv=i=>i/(e.N-1)*w;
    c.fillStyle="#f7f7f5";c.fillRect(0,0,w,h);
    c.strokeStyle="#e0e0dc";c.beginPath();c.moveTo(0,yv(0));c.lineTo(w,yv(0));c.stroke();
    e.issues.forEach(x=>{if(x.type==="jerk"&&x.j!==j)return;if(x.type==="ood"&&x.j!==j)return;c.fillStyle=TYPE[x.type].c+"22";c.fillRect(xv(x.a)-1,0,Math.max(2,xv(x.b)-xv(x.a)),h)});
    c.strokeStyle=["#2f6fed","#7a5af8","#0e9aa7","#e07b00","#d6409f","#1f9d6b"][j];c.lineWidth=1.5;c.beginPath();
    e.J[j].forEach((v,i)=>{const X=xv(i),Y=Math.max(1,Math.min(h-1,yv(v)));i?c.lineTo(X,Y):c.moveTo(X,Y)});c.stroke();
    e.issues.forEach(x=>{if(x.type==="jerk"&&x.j===j){c.fillStyle=TYPE.jerk.c;c.beginPath();c.arc(xv(x.a),Math.max(4,Math.min(h-4,yv(e.J[j][x.a]))),3.5,0,7);c.fill()}});
  });
}
function frame(){

  const r=$("#lane");const ph=$("#ph"),tr=$("#tracks");

}
function loop(t){
  if(playing&&sel){pos+=Math.max(0,t-lastT)/1000*HZ*speed;if(pos>=sel.N-1){pos=sel.N-1;playing=false}frame()}

    <canvas class="hm" id="hm" width="700" height="400" style="margin-top:10px"></canvas>
    <div class="legend"><span><i style="background:#dbe7ff"></i>1 demo</span><span><i style="background:#2f6fed"></i>4+ demos</span><span><i style="border:1.5px dashed #d9433f;background:none"></i>coverage gap</span></div></div>

      <div class="meta" style="margin:6px 0 10px">Left ${L[0]} · Center ${L[1]} · Right ${L[2]}. A policy trained on this split will likely fail on ${names[mi]}-side starts.</div>

      <div class="bars">${H.map(v=>`<div style="height:${v/hm*100}%"><span>${v||""}</span></div>`).join("")}</div>

  /* heatmap */

  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){
    const v=grid[r][q],yy=r*ch,xx=q*cw,reach=r>=1&&r<=4;
    if(v){const t=Math.min(1,v/4);c.fillStyle=`rgba(47,111,237,${.18+.72*t})`;c.fillRect(xx+2,yy+2,cw-4,ch-4);c.fillStyle=t>.5?"#fff":"#1c3f8f";c.font="600 14px Inter";c.textAlign="center";c.fillText(v,xx+cw/2,yy+ch/2+5)}
    else if(reach){c.strokeStyle="#d9433f";c.setLineDash([4,4]);c.strokeRect(xx+3,yy+3,cw-6,ch-6);c.setLineDash([])}
  }
  c.fillStyle="rgba(120,119,116,.35)";c.fillRect(W*.5-W*.14,6,W*.28,ch-12);c.fillStyle="#555";c.font="600 12px Inter";c.fillText("TRAY",W*.5,ch/2+4);
  c.fillStyle="#2f2f2c";c.beginPath();c.arc(W*.5,Hh-2,16,Math.PI,0);c.fill();
  c.strokeStyle="#2f6fed";c.lineWidth=2;c.setLineDash([6,5]);const bx=[0,.37,.65,1].map(v=>v*W);
  [1,2].forEach(i=>{c.beginPath();c.moveTo(bx[i],0);c.lineTo(bx[i],Hh);c.stroke()});c.setLineDash([]);
  c.fillStyle="#2f2f2c";c.font="600 12px Inter";["LEFT","CENTER","RIGHT"].forEach((t,i)=>c.fillText(`${t} (${L[i]})`,(bx[i]+bx[i+1])/2,Hh-24));
  $("#queueRec").onclick=()=>toast(`Queued ${need} ${names[mi]}-side scenarios in Demo Recorder`);
  $("#trimAll").onclick=()=>{K.filter(e=>e.issues.some(i=>i.type==="idle")).forEach(e=>trimIdle(e));renderHealth()};
}

/* ---------- export ---------- */
const STAGES=[["Validating schema (info.json, stats.json)",8],["Checking timestamps and frame sync",14],["Encoding cam_top to AV1",34],["Writing parquet shards",22],["Uploading to hub (3 LFS objects)",18],["Writing dataset card",4]];
let pushing=false;
function startPush(){
  if(pushing)return;pushing=true;const log=$("#plog");log.innerHTML="";let pct=0,si=0;
  const kept=EP.filter(e=>!e.dropped).length;
  $("#pgo").disabled=true;
  const add=t=>{log.innerHTML+=`<div>${t}</div>`;log.scrollTop=1e5};
  add(`> exporting ${kept} episodes (${EP.length-kept} dropped)`);
  (function step(){
    if(si>=STAGES.length){$("#pst").textContent="Pushed";$("#ppc").textContent="100%";$("#pbar").style.width="100%";add(`> done. https://huggingface.co/datasets/${$("#repo").value}`);add("> tag v2.1 created");pushing=false;$("#pgo").disabled=false;$("#pgo").textContent="Push again";return}
    const [name,w]=STAGES[si];$("#pst").textContent=name;add(`[${si+1}/${STAGES.length}] ${name}`);
    let k=0;const iv=setInterval(()=>{k++;pct+=w/8;$("#pbar").style.width=Math.min(100,pct)+"%";$("#ppc").textContent=Math.min(99,Math.round(pct))+"%";
      if(k%3===0&&si===4)add(`    uploaded ${(k*12.4).toFixed(0)} MB`);
      if(k>=8){clearInterval(iv);si++;step()}},170);
  })();
}

/* ---------- wiring ---------- */
document.addEventListener("click",ev=>{
  const f=ev.target.closest("[data-f]");if(f){filter=f.dataset.f;renderFilters();renderGrid();return}
  const c=ev.target.closest(".card");if(c){openEp(EP[+c.dataset.id])}
});
document.addEventListener("change",ev=>{if(ev.target.id==="sort"){sortBy=ev.target.value;renderGrid()}});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t.dataset.v));if(t.dataset.v==="health")renderHealth();else {drawPlots();frame()}});
$("#btnExport").onclick=()=>{$("#exportM").classList.add("on");$("#pst").textContent="Ready";$("#pbar").style.width="0";$("#ppc").textContent="";$("#plog").innerHTML=`<div>> waiting for push</div>`;$("#pgo").textContent="Start push"};
$("#pclose").onclick=()=>{if(!pushing)$("#exportM").classList.remove("on")};
$("#pgo").onclick=startPush;
$("#btnRescan").onclick=()=>{EP.forEach(analyze);refresh(true);toast("Rescanned 40 episodes in 0.8s")};
window.addEventListener("resize",()=>{drawPlots();frame()});
document.addEventListener("keydown",ev=>{
  if(!sel||ev.target.tagName==="INPUT"||ev.target.tagName==="SELECT")return;
  if(ev.code==="Space"){ev.preventDefault();playing=!playing;lastT=performance.now();frame()}
  if(ev.code==="ArrowRight"){pos=Math.min(sel.N-1,pos+5);frame()}
  if(ev.code==="ArrowLeft"){pos=Math.max(0,pos-5);frame()}
});
renderFilters();renderGrid();
/* open worst episode so the page is alive immediately */
openEp([...EP].sort((a,b)=>a.q-b.q)[0]);
if(window.innerWidth<=1000)$("#detail").classList.remove("open");
if(location.hash==='#health')document.querySelector('[data-v=health]').click();
playing=true;lastT=performance.now();
requestAnimationFrame(loop);
</script>
</body>
