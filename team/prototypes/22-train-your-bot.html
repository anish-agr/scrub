<!doctype html>
<!--
FEATURES:
- Teach mode: drag the cartoon arm's hand to the block and drop it in the basket; each run is saved as a demo
- Learning animation (dots converging) after every demo
- Test mode: robot tries on the block position you choose; success is sampled from a simple coverage model
- Fake model: success at a spot depends on how close and how many demos cover it (diversity matters, not just count)
- Live "what the robot knows" heatmap over the table, learning curve chart that updates with every demo
- Badges: First demo, 5 demos, 10 demos, First win, Generalization Hero (worked in a spot never shown), Explorer, Expert
- Big STOP button, reset, tap-to-move block, touch and mouse support
-->
<!-- SPONSORS: Perceptron Robotics (fine-tuning via demos, education angle), Gemini API (could narrate coaching hints), Backboard (remember a child's progress and badges), MongoDB Atlas (store demos) -->
<!-- BACKEND HOOKS: POST /api/demos {episode: [{t,x,y,grip}], blockStart} to record, POST /api/train (kick off LeRobot fine-tune), GET /api/train/status (WS /ws train_progress), POST /api/request {task:'pick_block_to_basket'} for test run, POST /api/stop, GET /api/eval?grid=9x4 for coverage heatmap -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Train Your Bot</title>
<meta name="description" content="A playful game where kids teach a robot arm to pick up a block by showing it examples, and watch it learn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--ink:#2b2350;--pink:#ff6fa5;--blue:#4cc3ff;--yel:#ffd23f;--grn:#3ddc97;--pur:#8b6bff;--org:#ff9248;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,'Trebuchet MS',sans-serif}
body{min-height:100vh;background:
 radial-gradient(circle at 10% 10%,#ffe0f0 0,transparent 30%),radial-gradient(circle at 90% 5%,#dff4ff 0,transparent 30%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.5px}
h1 span:nth-child(1){color:var(--pink)}h1 span:nth-child(2){color:var(--blue)}h1 span:nth-child(3){color:var(--org)}
.sp{flex:1}
.pill{background:var(--card);border-radius:99px;padding:6px 16px;font-weight:600;box-shadow:0 3px 0 rgba(43,35,80,.12);min-height:44px;display:flex;align-items:center;gap:8px;border:0}
.stop{background:#ff4b5c;color:#fff;font-weight:700;border:0;border-radius:99px;min-height:44px;padding:0 22px;box-shadow:0 4px 0 #b3202f;letter-spacing:1px}
.stop:active{transform:translateY(3px);box-shadow:0 1px 0 #b3202f}
.stop.on{background:#fff;color:#ff4b5c;box-shadow:inset 0 0 0 3px #ff4b5c}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;padding:0 18px 24px;max-width:1200px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.box{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 6px 0 rgba(43,35,80,.1)}
.modes{display:flex;gap:8px;margin-bottom:10px}
.mode{flex:1;min-height:48px;border:0;border-radius:16px;font-weight:600;font-size:17px;background:#f0ecff;box-shadow:0 3px 0 rgba(43,35,80,.12)}
.mode.on{background:var(--pur);color:#fff}
.mode[data-m=test].on{background:var(--grn);color:#10392b}
.stagewrap{position:relative;border-radius:20px;overflow:hidden;border:4px solid var(--ink);background:#bfe9ff;touch-action:none}
canvas{display:block;width:100%;height:auto}
.bubble{position:absolute;left:10px;bottom:10px;right:10px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:500;pointer-events:none;box-shadow:0 3px 0 rgba(43,35,80,.2);transition:transform .2s}
.bubble b{color:var(--pink)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-height:52px;border:0;border-radius:18px;font-weight:700;font-size:18px;color:#fff;background:var(--pink);box-shadow:0 4px 0 #c43b73;min-width:140px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #c43b73}
.big.alt{background:var(--blue);box-shadow:0 4px 0 #2a8fc4}
.big.grn{background:var(--grn);color:#10392b;box-shadow:0 4px 0 #1f9d6a}
.big[disabled]{opacity:.5;pointer-events:none}
.small{min-height:44px;border:0;border-radius:14px;padding:0 14px;background:#f0ecff;font-weight:600;box-shadow:0 3px 0 rgba(43,35,80,.12)}
h2{margin:0 0 8px;font-size:19px}
.side{display:flex;flex-direction:column;gap:16px}
.meter{height:30px;border-radius:99px;background:#eee8ff;overflow:hidden;position:relative;border:3px solid var(--ink)}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--grn),var(--grn) 12px,#6af0b8 12px,#6af0b8 24px);transition:width .8s;border-radius:99px}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700}
.stats{display:flex;gap:8px;margin-top:10px}
.stats div{flex:1;background:#fff6e5;border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;opacity:.7}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.badge{background:#f4f1ff;border-radius:16px;padding:10px 6px;text-align:center;font-size:12px;font-weight:500;filter:grayscale(1);opacity:.45;transition:.4s;min-height:92px}
.badge .e{font-size:30px;display:block}
.badge.got{filter:none;opacity:1;background:#fff3c4;box-shadow:0 3px 0 #e8b500;animation:pop .6s}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.2) rotate(4deg)}100%{transform:scale(1)}}
.award{position:fixed;top:-120px;left:50%;transform:translateX(-50%);background:var(--yel);border:4px solid var(--ink);border-radius:22px;padding:12px 22px;font-weight:700;font-size:20px;z-index:20;transition:top .5s cubic-bezier(.3,1.6,.5,1);box-shadow:0 6px 0 rgba(43,35,80,.3);text-align:center;max-width:92vw}
.award.on{top:14px}
.conf{position:fixed;width:10px;height:14px;z-index:19;pointer-events:none}
.legend{display:flex;gap:12px;font-size:12px;flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1><span>Train</span> <span>Your</span> <span>Bot</span></h1>
  <div class="pill" id="nameTag">Robot: Bolt</div>
  <div class="sp"></div>
  <div class="pill">Demos: <b id="hDemos">0</b></div>
  <button class="stop" id="stop" aria-label="Stop the robot">STOP</button>
</header>
<main>
  <section class="box">
    <div class="modes">
      <button class="mode on" data-m="teach">1. Teach</button>
      <button class="mode" data-m="test">2. Test</button>
    </div>
    <div class="stagewrap">
      <canvas id="cv" width="640" height="440"></canvas>
      <div class="bubble" id="say"></div>
    </div>
    <div class="row" id="rowTeach">
      <button class="big alt" id="shuffle">Move the block</button>
      <button class="small" id="heatBtn">Show what Bolt knows</button>
    </div>
    <div class="row" id="rowTest" style="display:none">
      <button class="big grn" id="go">Go, Bolt!</button>
      <button class="big alt" id="shuffle2">Move the block</button>
    </div>
    <div class="legend"><span><i style="background:#ff6fa5"></i>demo spots</span><span><i style="background:#3ddc97"></i>Bolt is confident</span><span><i style="background:#ffd23f"></i>so so</span><span><i style="background:#ff6b6b"></i>needs help</span></div>
  </section>
  <aside class="side">
    <section class="box">
      <h2>Bolt's brain</h2>
      <div class="meter"><i id="mfill"></i><span id="mtxt">0%</span></div>
      <div class="stats"><div><b id="sDemos">0</b><span>demos</span></div><div><b id="sSpots">0</b><span>spots covered</span></div><div><b id="sTests">0/0</b><span>test wins</span></div></div>
    </section>
    <section class="box">
      <h2>Learning curve</h2>
      <canvas id="chart" width="360" height="190"></canvas>
      <div style="font-size:12px;opacity:.7;margin-top:4px">Tip: showing the block in different places beats showing the same place again and again.</div>
    </section>
    <section class="box">
      <h2>Badges</h2>
      <div class="badges" id="badges"></div>
      <div class="row"><button class="small" id="reset">Start over</button></div>
    </section>
  </aside>
</main>
<div class="award" id="award"></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),g=cv.getContext('2d'),W=640,H=440;
const BASE={x:320,y:415},L1=190,L2=185,BASKET={x:545,y:115,r:48};
const BOUND={x0:70,x1:570,y0:150,y1:330};
const SIGMA=105;
let mode='teach',demos=[],hist=[{n:0,v:0}],tests={w:0,n:0},got={},stopped=false;
let block={x:200,y:250,inBasket:false},hand={x:320,y:240},grab=false,dragging=false,start=null;
let showHeat=false,anim=null,dots=null,say='',busy=false,wob=0;

const BADGES=[
 ['first','🌱','First demo'],['five','🖐️','5 demos!'],['ten','🔟','10 demos'],
 ['win','🏆','First win'],['gen','🦸','Generalization Hero'],['explore','🧭','Explorer'],['pro','🎓','Pro Trainer']];
function drawBadges(){$('#badges').innerHTML=BADGES.map(b=>`<div class="badge ${got[b[0]]?'got':''}"><span class="e">${b[1]}</span>${b[2]}</div>`).join('')}

// fake model
function conf(x,y){
 let s=0;demos.forEach(d=>{const dd=(d.x-x)**2+(d.y-y)**2;s+=Math.exp(-dd/(2*SIGMA*SIGMA))});
 return 0.04+0.94*(1-Math.exp(-1.5*s));
}
function overall(){
 let t=0,n=0;for(let x=BOUND.x0;x<=BOUND.x1;x+=50)for(let y=BOUND.y0;y<=BOUND.y1;y+=45){t+=conf(x,y);n++}
 return t/n;
}
function nearestDemo(x,y){let m=1e9;demos.forEach(d=>m=Math.min(m,Math.hypot(d.x-x,d.y-y)));return m}
function spots(){let n=0;for(let x=BOUND.x0;x<=BOUND.x1;x+=50)for(let y=BOUND.y0;y<=BOUND.y1;y+=45)if(conf(x,y)>.6)n++;return n}

// IK
function ik(tx,ty){
 let dx=tx-BASE.x,dy=ty-BASE.y,d=Math.hypot(dx,dy);const mx=(L1+L2)*.985;
 if(d>mx){dx*=mx/d;dy*=mx/d;d=mx}
 if(d<60){dx*=60/Math.max(d,1);dy*=60/Math.max(d,1);d=60}
 const a=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
 const base=Math.atan2(dy,dx),s=(dx<0?1:-1);
 const ang=base+s*a*-1;
 const ex=BASE.x+Math.cos(base-a)*L1,ey=BASE.y+Math.sin(base-a)*L1;
 const ex2=BASE.x+Math.cos(base+a)*L1,ey2=BASE.y+Math.sin(base+a)*L1;
 // prefer elbow that sits outward (up/left or right), choose the one with smaller y... keep consistent: higher elbow
 const e=ey<ey2?{x:ex,y:ey}:{x:ex2,y:ey2};
 return {e,h:{x:BASE.x+dx,y:BASE.y+dy}};
}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function drawScene(t){
 // floor
 g.fillStyle='#bfe9ff';g.fillRect(0,0,W,H);
 g.fillStyle='#fff3d1';rr(24,100,W-48,260,30);g.fill();g.lineWidth=4;g.strokeStyle='#2b2350';g.stroke();
 // clouds
 g.fillStyle='#fff';[[90,40],[420,30],[560,60]].forEach(([x,y],i)=>{const o=Math.sin(t/2000+i)*8;g.beginPath();g.arc(x+o,y,18,0,7);g.arc(x+20+o,y+4,14,0,7);g.arc(x-18+o,y+5,13,0,7);g.fill()});
 // heatmap
 if(showHeat||mode==='test'){
  for(let x=BOUND.x0;x<=BOUND.x1;x+=25)for(let y=BOUND.y0-10;y<=BOUND.y1+10;y+=25){
   const c=conf(x,y);g.fillStyle=c>.7?'rgba(61,220,151,.5)':c>.4?'rgba(255,210,63,.5)':'rgba(255,107,107,.28)';
   g.beginPath();g.arc(x,y,13,0,7);g.fill();
  }
 }
 // basket
 g.fillStyle='#ff9248';rr(BASKET.x-52,BASKET.y-36,104,72,16);g.fill();g.stroke();
 g.fillStyle='#ffb87a';rr(BASKET.x-40,BASKET.y-26,80,36,10);g.fill();
 g.fillStyle='#2b2350';g.font='700 15px Fredoka';g.textAlign='center';g.fillText('BASKET',BASKET.x,BASKET.y+28);
 // demo markers
 demos.forEach((d,i)=>{g.fillStyle='#ff6fa5';g.beginPath();g.arc(d.x,d.y,7,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.font='700 9px Fredoka';g.fillText(i+1,d.x,d.y+3)});
 // block (if not held)
 if(!grab)drawBlock(block.x,block.y,t);
 // arm
 const k=ik(hand.x,hand.y);
 g.lineCap='round';g.lineJoin='round';
 // base
 g.fillStyle='#8b6bff';g.strokeStyle='#2b2350';g.lineWidth=4;rr(BASE.x-44,BASE.y-6,88,40,14);g.fill();g.stroke();
 const seg=(a,b,w,c)=>{g.strokeStyle='#2b2350';g.lineWidth=w+8;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()};
 seg(BASE,k.e,24,'#4cc3ff');seg(k.e,k.h,20,'#ff6fa5');
 [BASE,k.e].forEach(p=>{g.fillStyle='#ffd23f';g.strokeStyle='#2b2350';g.lineWidth=4;g.beginPath();g.arc(p.x,p.y,14,0,7);g.fill();g.stroke()});
 // claw
 const ang=Math.atan2(k.h.y-k.e.y,k.h.x-k.e.x),o=grab?4:15;
 g.save();g.translate(k.h.x,k.h.y);g.rotate(ang);
 g.fillStyle='#3ddc97';g.strokeStyle='#2b2350';g.lineWidth=4;
 [-1,1].forEach(s=>{g.beginPath();g.moveTo(0,s*o*.5);g.lineTo(24,s*o);g.lineTo(30,s*o*.5);g.lineTo(18,s*o*.2);g.closePath();g.fill();g.stroke()});
 g.beginPath();g.arc(0,0,11,0,7);g.fill();g.stroke();
 g.restore();
 // held block
 if(grab&&!block.inBasket)drawBlock(k.h.x+Math.cos(ang)*22,k.h.y+Math.sin(ang)*22,t,true);
 // face on base
 g.fillStyle='#fff';g.beginPath();g.arc(BASE.x-14,BASE.y+16,6,0,7);g.arc(BASE.x+14,BASE.y+16,6,0,7);g.fill();
 g.fillStyle='#2b2350';const bl=(Math.floor(t/2500)%2&&t%2500<150)?1:5;
 g.beginPath();g.ellipse(BASE.x-14+(stopped?0:Math.sin(t/900)*2),BASE.y+16,2.5,bl/2+.5,0,0,7);g.ellipse(BASE.x+14+(stopped?0:Math.sin(t/900)*2),BASE.y+16,2.5,bl/2+.5,0,0,7);g.fill();
 // hint ring on hand
 if(mode==='teach'&&!dragging&&!anim&&!busy){g.strokeStyle='rgba(43,35,80,.5)';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.arc(k.h.x,k.h.y,34+Math.sin(t/300)*3,0,7);g.stroke();g.setLineDash([])}
 // learning dots
 if(dots){
  const p=Math.min(1,(t-dots.t0)/1700),e=1-Math.pow(1-p,3);
  dots.list.forEach(d=>{const x=d.x+(dots.tx-d.x)*e+Math.sin(p*9+d.k)*(1-p)*20,y=d.y+(dots.ty-d.y)*e+Math.cos(p*9+d.k)*(1-p)*20;
   g.fillStyle=d.c;g.beginPath();g.arc(x,y,6-3*p,0,7);g.fill()});
  g.fillStyle='rgba(43,35,80,.85)';rr(W/2-110,16,220,40,20);g.fill();g.fillStyle='#fff';g.font='600 18px Fredoka';g.textAlign='center';g.fillText('Bolt is learning'+'.'.repeat(1+Math.floor(t/300)%3),W/2,43);
  if(p>=1){dots=null}
 }
 if(stopped){g.fillStyle='rgba(255,75,92,.25)';g.fillRect(0,0,W,H);g.fillStyle='#ff4b5c';g.font='700 40px Fredoka';g.textAlign='center';g.fillText('STOPPED',W/2,H/2)}
}
function drawBlock(x,y,t,held){
 g.save();g.translate(x,y);if(!held&&!anim&&!dragging)g.translate(0,Math.sin(t/400)*2);
 g.fillStyle='rgba(0,0,0,.15)';if(!held){g.beginPath();g.ellipse(2,20,20,6,0,0,7);g.fill()}
 g.fillStyle='#ffd23f';g.strokeStyle='#2b2350';g.lineWidth=4;rr(-20,-20,40,40,9);g.fill();g.stroke();
 g.fillStyle='#2b2350';g.beginPath();g.arc(-7,-3,3,0,7);g.arc(7,-3,3,0,7);g.fill();
 g.lineWidth=2.5;g.beginPath();g.arc(0,3,7,.15,Math.PI-.15);g.stroke();g.restore();
}
function loop(t){
 stepAnim(t);drawScene(t);requestAnimationFrame(loop);
}
// animations for robot test
function easeIO(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2}
function stepAnim(t){
 if(!anim)return;
 if(stopped){return}
 const a=anim;if(!a.t0)a.t0=t;
 const ph=a.phases[a.i];if(!ph.t0)ph.t0=t;
 const p=Math.min(1,(t-ph.t0)/ph.d),e=easeIO(p);
 if(ph.to){hand.x=ph.from.x+(ph.to.x-ph.from.x)*e;hand.y=ph.from.y+(ph.to.y-ph.from.y)*e}
 if(p>=1){
  if(ph.done)ph.done();
  a.i++;if(a.i>=a.phases.length){const f=a.finish;anim=null;f&&f()}
  else{const nx=a.phases[a.i];nx.t0=0;if(nx.to&&!nx.from)nx.from={x:hand.x,y:hand.y}}
 }
}
function runTest(){
 if(anim||busy||stopped)return;
 const pr=conf(block.x,block.y),ok=Math.random()<pr,nd=nearestDemo(block.x,block.y);
 const tgt={x:block.x,y:block.y};busy=true;
 const missed={x:block.x+(Math.random()<.5?-1:1)*rnd(45,70),y:block.y+rnd(-30,30)};
 const ph=[{to:ok?tgt:missed,d:900,from:{x:hand.x,y:hand.y}}];
 if(ok){
  ph.push({d:250,done:()=>{grab=true}});
  ph.push({to:{x:BASKET.x,y:BASKET.y+8},d:1000});
  ph.push({d:250,done:()=>{grab=false;block.inBasket=true;block.x=BASKET.x;block.y=BASKET.y+6}});
 }else{
  ph.push({d:300});
  ph.push({d:400});
 }
 ph.push({to:{x:320,y:240},d:700});
 anim={i:0,phases:ph,finish:()=>{
  busy=false;tests.n++;
  if(ok){tests.w++;say2('<b>Yes!</b> Bolt did it!'+(nd>110?' And you never showed that spot!':''));award('win');
    if(nd>110&&demos.length>=3)award('gen');
    setTimeout(()=>{if(mode==='test')newBlock()},700)}
  else say2('<b>Oops!</b> Bolt missed. Teach it more examples near the block.');
  refresh();}};
 say2('Bolt is thinking... confidence '+Math.round(pr*100)+'%');
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function newBlock(){
 let x,y,tries=0;do{x=rnd(BOUND.x0,BOUND.x1);y=rnd(BOUND.y0,BOUND.y1);tries++}while((Math.hypot(x-BASE.x,y-BASE.y)<110||Math.hypot(x-BASKET.x,y-BASKET.y)<90)&&tries<50);
 block={x,y,inBasket:false};grab=false;
}
function say2(h){$('#say').innerHTML=h}
// pointer
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
 if(stopped||anim||busy||dots)return;
 const p=pt(e);
 if(mode==='teach'&&Math.hypot(p.x-hand.x,p.y-hand.y)<50){
  dragging=true;cv.setPointerCapture(e.pointerId);start={x:block.x,y:block.y};
  say2('Carry the block to the <b>basket</b>!');
 }else if(p.y>BOUND.y0-25&&p.y<BOUND.y1+25&&p.x>BOUND.x0-10&&p.x<BOUND.x1+10&&!(Math.hypot(p.x-BASKET.x,p.y-BASKET.y)<70)&&Math.hypot(p.x-BASE.x,p.y-BASE.y)>100){
  block={x:p.x,y:p.y,inBasket:false};grab=false;
  say2(mode==='teach'?'Block moved! Now drag my hand to it.':'Block moved. Press <b>Go, Bolt!</b>');
 }
});
cv.addEventListener('pointermove',e=>{
 if(!dragging)return;const p=pt(e);hand.x=p.x;hand.y=Math.max(60,Math.min(H-40,p.y));
 if(!grab&&!block.inBasket&&Math.hypot(hand.x-block.x,hand.y-block.y)<34){grab=true;say2('Got it! Now go to the <b>basket</b>.')}
 if(grab){block.x=hand.x;block.y=hand.y}
});
cv.addEventListener('pointerup',()=>{
 if(!dragging)return;dragging=false;
 if(grab&&Math.hypot(hand.x-BASKET.x,hand.y-BASKET.y)<BASKET.r+20){
  grab=false;block.inBasket=true;block.x=BASKET.x;block.y=BASKET.y+6;addDemo(start);
 }else if(grab){grab=false;block.x=hand.x;block.y=hand.y;say2('Dropped! Pick it up again and aim for the basket.')}
 else say2('Drag my hand onto the block first.');
});
function addDemo(s){
 demos.push({x:s.x,y:s.y});
 dots={t0:performance.now(),tx:s.x,ty:s.y,list:Array.from({length:34},(_,k)=>({x:rnd(10,W-10),y:rnd(20,H-20),k,c:['#ff6fa5','#4cc3ff','#ffd23f','#3ddc97','#8b6bff'][k%5]}))};
 hist.push({n:demos.length,v:overall()});
 say2('Demo #'+demos.length+' saved! Bolt learns from it...');
 award('first');if(demos.length>=5)award('five');if(demos.length>=10)award('ten');
 const zones=new Set(demos.map(d=>Math.floor((d.x-BOUND.x0)/(BOUND.x1-BOUND.x0)*3.0001)+'-'+(d.y>240?1:0)));
 if(zones.size>=4)award('explore');
 setTimeout(()=>{if(overall()>=.85)award('pro')},1800);
 setTimeout(()=>{newBlock();hand={x:320,y:240};say2('Now show a <b>different</b> spot. Try tapping the table to move the block!');refresh()},1800);
 refresh();
}
function refresh(){
 const o=overall();
 $('#hDemos').textContent=demos.length;$('#sDemos').textContent=demos.length;$('#sSpots').textContent=spots();
 $('#sTests').textContent=tests.w+'/'+tests.n;
 $('#mfill').style.width=Math.round(o*100)+'%';$('#mtxt').textContent=Math.round(o*100)+'% skilled';
 drawChart();drawBadges();
}
function drawChart(){
 const c=$('#chart'),x=c.getContext('2d'),w=360,h=190,pl=34,pb=26,pt=10,pr=10;
 x.clearRect(0,0,w,h);
 const maxN=Math.max(10,demos.length+2);
 const X=n=>pl+n/maxN*(w-pl-pr),Y=v=>h-pb-v*(h-pb-pt);
 x.strokeStyle='#e5def8';x.fillStyle='#2b2350';x.lineWidth=1;x.font='11px Fredoka';x.textAlign='right';
 [0,.25,.5,.75,1].forEach(v=>{x.beginPath();x.moveTo(pl,Y(v));x.lineTo(w-pr,Y(v));x.stroke();x.fillText(Math.round(v*100)+'%',pl-4,Y(v)+4)});
 x.textAlign='center';for(let n=0;n<=maxN;n+=Math.ceil(maxN/6))x.fillText(n,X(n),h-8);
 x.fillText('number of demos',w/2+10,h-0);
 // area
 const gr=x.createLinearGradient(0,pt,0,h-pb);gr.addColorStop(0,'rgba(61,220,151,.5)');gr.addColorStop(1,'rgba(61,220,151,0)');
 x.beginPath();x.moveTo(X(0),Y(0));hist.forEach(p=>x.lineTo(X(p.n),Y(p.v)));x.lineTo(X(hist[hist.length-1].n),Y(0));x.closePath();x.fillStyle=gr;x.fill();
 x.strokeStyle='#3ddc97';x.lineWidth=4;x.lineJoin='round';x.beginPath();hist.forEach((p,i)=>i?x.lineTo(X(p.n),Y(p.v)):x.moveTo(X(p.n),Y(p.v)));x.stroke();
 hist.forEach(p=>{x.fillStyle='#fff';x.strokeStyle='#2b2350';x.lineWidth=2.5;x.beginPath();x.arc(X(p.n),Y(p.v),5,0,7);x.fill();x.stroke()});
}
let awq=[];
function award(k){
 if(got[k])return;got[k]=1;const b=BADGES.find(b=>b[0]===k);
 const msg={gen:'Generalization Hero! It worked where you never showed it!',first:'First demo done!',five:'5 demos! Bolt is getting smart!',ten:'10 demos! Wow!',win:'First win! Bolt did it alone!',explore:'Explorer! You showed many different spots!',pro:'Pro Trainer! Bolt is 85% skilled!'}[k];
 awq.push(b[1]+' '+msg);if(awq.length===1)showAw();
 refresh();confetti();
}
function showAw(){
 if(!awq.length)return;const a=$('#award');a.textContent=awq[0];a.classList.add('on');
 setTimeout(()=>{a.classList.remove('on');awq.shift();setTimeout(showAw,500)},2600);
}
function confetti(){
 for(let i=0;i<40;i++){const d=document.createElement('div');d.className='conf';d.style.background=['#ff6fa5','#4cc3ff','#ffd23f','#3ddc97','#8b6bff'][i%5];
  d.style.left=rnd(10,90)+'vw';d.style.top='-20px';document.body.appendChild(d);
  d.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${innerHeight}px) translateX(${rnd(-80,80)}px) rotate(${rnd(200,700)}deg)`,opacity:.8}],{duration:rnd(1400,2600),easing:'ease-in'}).onfinish=()=>d.remove();}
}
// ui
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
 mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));
 $('#rowTeach').style.display=mode==='teach'?'':'none';$('#rowTest').style.display=mode==='test'?'flex':'none';
 anim=null;busy=false;grab=false;hand={x:320,y:240};
 if(!block||block.inBasket)newBlock();
 say2(mode==='teach'?'Drag my <b>hand</b> to the block, then carry it to the basket.':(demos.length?'Tap the table to place the block, then press <b>Go, Bolt!</b>':'I have not seen any demos yet! Teach me first.'));
});
$('#go').onclick=()=>{ if(block.inBasket)newBlock(); runTest()};
['shuffle','shuffle2'].forEach(id=>$('#'+id).onclick=()=>{if(!anim&&!busy){newBlock();grab=false}});
$('#heatBtn').onclick=()=>{showHeat=!showHeat;$('#heatBtn').textContent=showHeat?'Hide what Bolt knows':'Show what Bolt knows'};
$('#stop').onclick=()=>{
 stopped=!stopped;$('#stop').classList.toggle('on',stopped);$('#stop').textContent=stopped?'RESUME':'STOP';
 if(stopped){say2('<b>Stopped.</b> Bolt will not move until you press RESUME.')}else{say2('Back to work!');
  if(anim){anim.phases.forEach(p=>{p.t0=0});anim.phases[anim.i].from={x:hand.x,y:hand.y};}}
};
$('#reset').onclick=()=>{demos=[];hist=[{n:0,v:0}];tests={w:0,n:0};got={};awq=[];newBlock();hand={x:320,y:240};anim=null;busy=false;grab=false;dots=null;say2('Fresh start! Teach Bolt something new.');refresh()};
newBlock();say2('Hi! I am <b>Bolt</b>. Drag my <b>hand</b> to the block, then carry it to the basket.');refresh();
requestAnimationFrame(loop);
</script>
</body>
</html>
