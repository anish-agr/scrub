<title>Scrub Board Mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Plain tab strip around four static mockups. */
:root{--bg:#efece4;--fg:#1a1c1d;--mute:#5f625d;--rule:#c9c3b3;--on:#1a1c1d;--onfg:#f3efe4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151715;--fg:#e4e1d8;--mute:#9b988f;--rule:#383b36;--on:#e4e1d8;--onfg:#151715;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151715;--fg:#e4e1d8;--mute:#9b988f;--rule:#383b36;--on:#e4e1d8;--onfg:#151715;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:12px 0 8px;border-bottom:2px solid var(--fg)}
h1{font:600 16px "IBM Plex Sans",sans-serif;margin:0}
nav{display:flex;flex-wrap:wrap;gap:0}
nav button{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;background:none;color:var(--fg);border:1px solid var(--rule);padding:6px 10px;margin:0 -1px 0 0;cursor:pointer;border-radius:0}
nav button[aria-selected="true"]{background:var(--on);color:var(--onfg);border-color:var(--on)}
#full{margin-left:auto;font:12px "IBM Plex Mono",monospace;background:none;color:var(--fg);border:1px solid var(--fg);padding:6px 10px;cursor:pointer;border-radius:0}
p.d{margin:8px 0;color:var(--mute);max-width:80ch}
.stage{flex:1;min-height:520px;border:1px solid var(--rule);margin-bottom:16px;background:var(--bg)}
.stage.full{position:fixed;inset:0;margin:0;z-index:10;border:0}
iframe{width:100%;height:100%;border:0;display:block}
#close{position:fixed;top:10px;right:10px;z-index:11;font:12px "IBM Plex Mono",monospace;background:#111;color:#eee;border:1px solid #eee;padding:6px 10px;cursor:pointer}
</style>
<header>
  <h1>Scrub status boards, mockups</h1>
  <nav id="tabs" role="tablist"></nav>
  <button id="full">Full screen</button>
</header>
<p class="d" id="desc"></p>
<div class="stage" id="stage"><iframe id="f" title="mockup"></iframe></div>
<button id="close" hidden>Close (Esc)</button>
<script>
const M=[
 ["wall-display.html","Wall display","OR wall screen read from 3 m: current step, item, request-to-hand timer, the count, STOP. Press S or Space to toggle STOP."],
 ["scrub-tablet.html","Scrub tablet","Tablet by the tray: slot states, queue, heard and said log, Stop / Clear stop / Got it / Count."],
 ["bring-up.html","Bring-up","Pre-demo test sheet: each subsystem, its real command, pass / fail / untested. Keys show names only."],
 ["item-id.html","Item ID","How the overhead camera decides which item is which: slot position, Perceptron detect, optional ArUco tag. No OCR."]];
const tabs=document.getElementById('tabs'),f=document.getElementById('f'),stage=document.getElementById('stage'),close=document.getElementById('close');
function show(i){M.forEach((m,j)=>tabs.children[j].setAttribute('aria-selected',i===j));f.src=M[i][0];document.getElementById('desc').textContent=M[i][2];try{localStorage.setItem('mk',i)}catch(e){}}
M.forEach((m,i)=>{const b=document.createElement('button');b.role='tab';b.textContent=m[1];b.onclick=()=>show(i);tabs.appendChild(b);});
function setFull(on){stage.classList.toggle('full',on);close.hidden=!on;if(on){stage.requestFullscreen?.().catch(()=>{});}else if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}}
document.getElementById('full').onclick=()=>setFull(true);close.onclick=()=>setFull(false);
addEventListener('keydown',e=>{if(e.key==='Escape')setFull(false);});
let start=0;try{start=+localStorage.getItem('mk')||0}catch(e){}
const h=location.hash.slice(1),hi=M.findIndex(m=>m[0].startsWith(h));show(h&&hi>=0?hi:start);
</script>
