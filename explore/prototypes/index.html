<title>SO-101 Prototype Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: printed catalog index. Left column = numbered index entries grouped by section, ruled; right = preview plate. */
:root{
  --bg:#f4f2ec; --panel:#faf9f5; --ink:#141412; --dim:#5d5b54; --line:#141412; --hair:#c9c6bb;
  --accent:#d6330f; --accent-ink:#ffffff; --pick:#d6330f; --chip:#ebe8de;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412; --panel:#1b1b18; --ink:#ecebe3; --dim:#a3a197; --line:#ecebe3; --hair:#3a3934;
  --accent:#ff5a36; --accent-ink:#1a0a05; --pick:#ff5a36; --chip:#252521; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --panel:#1b1b18; --ink:#ecebe3; --dim:#a3a197; --line:#ecebe3; --hair:#3a3934;
  --accent:#ff5a36; --accent-ink:#1a0a05; --pick:#ff5a36; --chip:#252521; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-inline:16px;padding-block:0}
.app{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;height:100%;padding-block:16px}
header.brand{display:flex;flex-direction:column;gap:4px;padding:0 0 12px;border-bottom:3px solid var(--line)}
h1{font:800 30px/1.02 var(--display);margin:0;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--dim);margin:0;font-size:13px}
.stats{display:flex;gap:14px;font:500 12px var(--mono);color:var(--dim);margin-top:6px}
.stats b{color:var(--ink);font-weight:500}
aside{display:flex;flex-direction:column;min-height:0}
.filters{display:flex;flex-wrap:wrap;gap:0;padding:0;border-bottom:1px solid var(--line)}
.chipbtn{font:500 12px var(--mono);border:0;border-right:1px solid var(--hair);background:none;color:var(--ink);border-radius:0;padding:8px 10px;cursor:pointer;min-height:36px}
.chipbtn:hover{text-decoration:underline}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chipbtn:focus-visible,.item:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:22px;padding:14px 0 16px}
.group h2{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin:0;padding-bottom:4px;border-bottom:2px solid var(--line)}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:8px 4px;color:inherit;cursor:pointer;font:inherit}
.item:hover .iname{text-decoration:underline}
.item[aria-current="true"]{background:var(--ink);color:var(--bg)}
.item[aria-current="true"] .idesc{color:var(--bg);opacity:.8}
.num{font:500 12px var(--mono);color:var(--dim);padding-top:2px;font-variant-numeric:tabular-nums}
.item[aria-current="true"] .num{color:var(--bg)}
.iname{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.idesc{color:var(--dim);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--pick);border:1px solid currentColor;border-radius:0;padding:0 4px}
.item[aria-current="true"] .pick{color:var(--bg)}
main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:3px solid var(--line)}
.bar h3{font:800 24px/1.1 var(--display);margin:0;flex:1 1 260px;min-width:0;text-wrap:balance;letter-spacing:-.01em}
.bar h3 small{display:block;font:400 13px var(--body);color:var(--dim);margin-top:2px;letter-spacing:0}
.seg{display:flex;border:1px solid var(--line);border-radius:0}
.seg button{border:0;background:var(--panel);color:var(--ink);font:500 12px var(--mono);padding:8px 12px;cursor:pointer;min-height:36px;border-radius:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:0;padding:8px 14px;min-height:36px;font:600 13px var(--body);text-decoration:none;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer}
.btn:hover{text-decoration:underline}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:0;overflow:hidden;display:flex;justify-content:center;align-items:stretch;min-height:0}
.stage iframe{border:0;width:100%;height:100%;background:#fff;display:block}
.stage.phone{padding:16px;background:var(--chip)}
.stage.phone iframe{width:390px;max-width:100%;border:2px solid var(--line)}
.meta{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;max-height:30vh;overflow:auto;border-top:3px solid var(--line);padding:12px 0 0}
.meta h4{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.meta ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.tags{display:flex;flex-wrap:wrap;gap:0 12px;margin-bottom:12px}
.tag{font:500 11.5px var(--mono);border-bottom:1px solid var(--hair);padding:2px 0}
.hooks{font:12px/1.5 var(--mono);color:var(--dim);word-break:break-word}
.empty{color:var(--dim)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .list{max-height:42vh}
  main{grid-template-rows:auto 70vh auto}
  .meta{grid-template-columns:1fr;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside>
    <header class="brand">
      <h1>SO-101 Prototype Bench</h1>
      <p class="sub">DubHacks 2026 software concepts for the arm. Every page runs on a mock arm, no server needed.</p>
      <div class="stats" id="stats"></div>
    </header>
    <div class="filters" id="filters" role="group" aria-label="Filter by sponsor track"></div>
    <nav class="list" id="list" aria-label="Prototypes"></nav>
  </aside>
  <main>
    <div class="bar">
      <h3 id="ptitle">Select a prototype<small id="pdesc"></small></h3>
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" id="vDesk" aria-pressed="true">Desktop</button>
        <button type="button" id="vPhone" aria-pressed="false">Phone</button>
      </div>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">Open full page</a>
    </div>
    <div class="stage" id="stage"><iframe id="frame" title="Prototype preview" loading="lazy"></iframe></div>
    <section class="meta" aria-label="Prototype details">
      <div><h4>Features</h4><ul id="feat"></ul></div>
      <div><h4>Sponsor tracks</h4><div class="tags" id="spons"></div><h4>Backend hooks</h4><div class="hooks" id="hooks"></div></div>
    </section>
  </main>
</div>
<footer style="border-top:1px solid var(--hair);margin:0 0 16px;padding-top:8px;font:12px var(--mono);color:var(--dim)">Terms &nbsp; Privacy</footer>

<script>
const DATA = [{"id": "01", "file": "01-mission-control.html", "title": "Glass Box Mission Control", "desc": "A control-room view of the robot's mind: cameras, detections, policy action chunks, telemetry, task state and verification, all observable.", "features": ["Fake wrist + overhead camera feeds (canvas) with moving objects, detection boxes and confidence", "Policy selector (ACT / SmolVLA / Perceptron checkpoint) with live 50-step action chunk ghost lines", "6-joint telemetry sparklines streaming at 30Hz", "Task state machine idle > approach > grasp > lift > deliver > verify lighting up", "Post-action verification panel (before/after frames + success score)", "Event log, latched STOP + reset, keyboard: Space = STOP, R = reset", "\"Judge: move the object\" button relocates an object; system re-detects and re-plans visibly"], "sponsors": "Perceptron Robotics (checkpoint choice, observability), Perceptron Perception (detection, verification), Tiger Data (telemetry time series), Photon (alerts on failure), Gemini API (optional verify caption)", "hooks": "GET /api/state, POST /api/detect, POST /api/request, POST /api/stop, POST /api/reset, POST /api/mock/move/{label}, GET /api/trials, WebSocket /ws (state, detections, plan, step, safety). Defaults to mock mode, no server needed."}, {"id": "02", "file": "02-digital-twin.html", "title": "SO-101 Digital Twin", "desc": "A 3D digital twin of the SO-101 arm with trajectory replay, policy ghost overlay, workspace heat dome and a human-hand safety zone.", "features": ["three.js SO-101 style 6-DOF arm twin (box/cylinder approximation) on a lab table with bottle, cup, block, tray", "Joint sliders, recorded mock trajectory playback with scrubber timeline and speed control", "Ghost arm + path trace of the policy's predicted trajectory vs actual executed trajectory, with live deviation readout", "Reachability heat dome (workspace envelope) toggle", "Click the table to place a target; fake IK animates the arm there, refuses unreachable or keep-out targets", "Safety keep-out zone around a moving human hand; arm holds when breached; latched STOP", "Camera presets: orbit, top, front, side, follow tip"], "sponsors": "Perceptron Robotics (policy vs actual replay, fine-tune demo review), Tiger Data (trajectory time series source), Vultr (policy inference host), Photon (breach alert hook)", "hooks": "GET /api/state (joint targets, latched), WebSocket /ws (state, step, safety, detections), POST /api/stop, POST /api/reset, POST /api/request {task, target_id}, GET /api/trials. Defaults to mock mode, no server needed."}, {"id": "03", "file": "03-data-surgeon.html", "title": "Episode Studio", "desc": "A LeRobot dataset doctor that finds, fixes and explains bad robot demonstration episodes before you fine-tune.", "features": ["Grid of 40 mock LeRobot episodes with canvas-drawn thumbnail strips, duration, success flag, quality score", "Episode detail: synchronized fake overhead video, scrubber, 6 joint trajectory plots, gripper state band", "Auto-detected problems (jerk spikes, idle start/end, gripper chatter, camera dropout, out-of-distribution pose) as colored timeline markers (detection runs on the actual mock data)", "One-click Trim idle, Drop episode, Relabel (success flag + instruction), all recompute scores live", "Gemini-style auto instruction with paraphrases, regenerate and pick-as-label", "Dataset health dashboard: object start-position heatmap, success rate, length histogram, coverage recommendation", "Export to Hugging Face Hub with fake multi-stage push progress"], "sponsors": "Perceptron Robotics (data for fine-tuning), Gemini API (instruction + paraphrase generation), Tiger Data (time-series episode telemetry), MongoDB Atlas (episode metadata), Backboard (dataset memory/recommendations)", "hooks": "GET /api/datasets/{id}/episodes ; GET /api/episodes/{n}/frames?cam=top ; GET /api/episodes/{n}/telemetry (Tiger Data hypertable) ; POST /api/episodes/{n}/trim {start,end} ; POST /api/episodes/{n}/drop ; PATCH /api/episodes/{n} {success,instruction} ; POST /api/gemini/instructions {episode} ; GET /api/datasets/{id}/coverage ; POST /api/datasets/{id}/push {repo_id} (SSE progress)"}, {"id": "04", "file": "04-teleop-recorder.html", "title": "Demo Recorder", "desc": "The at-the-arm console for recording teleop demos with randomized scenarios, booking shared arms and tracking fine-tune jobs.", "features": ["Big record/stop with 3-2-1 countdown, episode counter vs goal (23/50), segmented progress, keep/re-record review step", "Live leader arm vs follower arm mirror (side-view skeletons + per-joint leader/follower/error bars + latency)", "Fake overhead camera feed (canvas) of the follower doing the task", "Randomized scenario card deck (object position A-F, rotation, lighting, object, distractor) to force data diversity, with position coverage bars", "Voice cue toggle (speechSynthesis), beeps, keyboard shortcuts: space=record/stop, r=re-record, n=save+next, esc=E-STOP", "Latched E-STOP in the header", "Arm Booking tab: 5 arms x 4 teams timeline, our slots highlighted, live countdown to next slot, per-slot checklist", "Fine-tune tab: Perceptron-style job tracker with live loss curve, ETA, per-checkpoint eval success, deploy-to-arm"], "sponsors": "Perceptron Robotics (fine-tune endpoint, SO-101 teleop data), Tiger Data (time-series telemetry at 50 Hz), MongoDB Atlas (episode + scenario metadata), Gemini API (voice cues / scenario narration), Backboard (remember what scenarios are under-covered)", "hooks": "WS /ws/teleop (leader/follower joint frames 50 Hz) ; POST /api/record/start ; POST /api/record/stop {keep:boolean} ; POST /api/estop ; GET /api/scenarios/next?coverage=1 ; GET /api/booking/arms ; POST /api/booking/swap ; POST /api/perceptron/finetune {dataset,base} ; GET /api/perceptron/jobs/{id}/metrics (SSE) ; POST /api/arm/deploy {checkpoint}"}, {"id": "05", "file": "05-photon-thread.html", "title": "Photon Thread", "desc": "A split-screen replay of the caregiver iMessage thread and the home robot console it controls.", "features": ["Split screen: realistic iPhone iMessage mock (caregiver Maria) + Reach home robot console", "Scripted replayable scenario with play / pause / step / restart / speed / chapter jump", "Ch1 approval request with detection photo (YES / NO / CALL), tapback thumbs-up counts as YES", "Ch2 remote text command (\"bring her the water bottle\") with numbered clarification list and a low-confidence refusal path", "Ch3 no reply escalation ladder (reminder at 2:30, call at 5:00, backup caregiver, expiry, late YES rejected)", "Ch4 \"STOP\" text latches the arm until someone presses Reset at the robot", "Ch5 daily digest message", "Type your own replies in the phone: console reacts live (exact tokens only, unknown text does nothing)", "Typing indicators, delivered / read receipts, tapbacks (tap a robot bubble), webhook / Spectrum event log, mock arm + camera + telemetry"], "sponsors": "Photon (Spectrum iMessage agent, webhook + send sidecar), Perceptron Robotics (SO-101 plan + post-action verification), Perceptron Perception (object localization boxes + confidence), Backboard (rota / preferences surfaced in 06-family-hub)", "hooks": "POST /api/photon/webhook (inbound, X-Spectrum-Signature), Node sidecar POST http://localhost:3001/send {to,text,photo_b64} (outbound via spectrum-ts),\nGET /api/state, POST /api/detect, POST /api/request {task,target_id}, POST /api/caregiver/approve?approved=true|false, POST /api/stop, POST /api/reset, WebSocket /ws (state, detections, plan, step, safety, caregiver). Defaults to mock mode, no server needed."}, {"id": "06", "file": "06-family-hub.html", "title": "Family Hub", "desc": "A warm caregiver dashboard for a remote family member: timeline, pill organizer, photos, safety refusals, rota and robot memory.", "features": ["Warm caregiver web dashboard for the remote family member (Maria) looking after Mom (Margaret)", "Today timeline with a live \"now\" marker and simulated incoming robot events", "Weekly pill organizer: taken / late / missed / pending slots, click a slot for details, adherence ring", "Activity feed with verification photos, confidence chips, hearts and notes", "Safety refusals log with reasons (\"confidence 0.71 < 0.80\"), live \"would pass at threshold\" chips tied to the settings slider", "Settings: which tasks need approval (Always / If unsure / Never), escalation timer, confidence floor, digest time", "Care team rota: click a shift to reassign, who is on call now, escalation chain, call / text buttons", "Memory panel (Backboard idea): preferences, places, routines, safety notes; add, pin, delete, search, \"ask memory\"", "Stop robot button latches the arm remotely (mock)"], "sponsors": "Backboard (persistent AI memory / RAG for household preferences), Photon (approvals and escalation over iMessage), Perceptron Robotics (verified fetches, safety refusals), Perceptron Perception (confidence scores), Tiger Data (time-series adherence and telemetry), MongoDB Atlas (memory + rota documents)", "hooks": "GET /api/activity?limit=, GET /api/state, POST /api/stop, POST /api/reset, POST /api/caregiver/approve?approved=, WebSocket /ws (state, safety, caregiver),\nproposed: GET/PUT /api/settings (approval policy, threshold, escalation minutes), GET/PUT /api/rota, GET/POST/DELETE /api/memory (Backboard), GET /api/adherence?week=. Mock mode only, no server needed."}, {"id": "07", "file": "07-one-switch.html", "title": "One Switch Reach", "desc": "An accessible control surface for a robot arm using one switch, pointing, voice, or head dwell.", "features": ["Single-switch scanning (auto-highlight, Space/Enter to select, adjustable speed, optional spoken options)", "Giant targets, 4 themes (calm, night, high-contrast yellow, high-contrast white), font size slider", "Point mode: camera view with huge labeled tappable boxes over detected items", "Voice mode: Web Speech API (typed fallback), live transcript, parsed intent chips (task=fetch target=phone)", "Dwell click / head-tilt simulation: hover ring timer, plus a tilt pad that drives a virtual cursor", "STOP: giant button, Escape, or ANY key held for 1 second (with visible hold ring); latches until RESET", "Arm progress as big plain words + progress ring; mock camera with 2-link arm animation"], "sponsors": "Perceptron Robotics (assistive fetch task, observable plan), Perceptron Perception (detections shown as targets),\nGemini API (intent parsing could replace the local parser), Photon (caregiver approval for risky items)", "hooks": "GET /api/state, POST /api/detect (items -> tiles/boxes), POST /api/say {text} (voice parse),\nPOST /api/request {task,target_id}, POST /api/confirm, POST /api/stop, POST /api/reset, WebSocket /ws (state, step, detections).\nRuns fully in mock mode with no server."}, {"id": "08", "file": "08-sous-chef-voice.html", "title": "Let's Get Cookin'", "desc": "A hands-free sous-chef: cook by voice while a robot arm hands you ingredients, holds the bowl, and keeps the timers.", "features": ["Recipe card with step navigation, per-step arm suggestions and one-tap timers", "Voice commands (Web Speech API with typed fallback): \"next step\", \"hand me the salt\", \"hold the bowl\", \"stir\", \"set a timer for 5 minutes\", \"flip the timer\"", "Arm action queue (pending, running with phases, done, failed with honest retry), sustained \"hold the bowl\" with Release", "Shelf map from camera detections with OCR'd jar labels (SALT, PAPRIKA...), confidence, and pick-order badges; animated gripper", "Multiple kitchen timers with rings, +1 min, pause, alarm; arm can flip the hourglass timer", "Mise en place mode: arm lays out shelf ingredients in recipe order onto a prep tray and checks each off", "Latched STOP always visible (Esc too); RESET to resume"], "sponsors": "Perceptron Robotics (hand-over, hold, stir skills; queue + retries are observable), Perceptron Perception (OCR on jar labels, object localization),\nGemini API (voice command to task parsing could replace the regex parser), Photon (text \"timer done\" or \"oil is low\" to a phone), Backboard (remember pantry layout and preferences), Tiger Data (log arm action durations)", "hooks": "POST /api/detect (shelf detections with OCR labels), POST /api/say {text}, POST /api/request {task,target_id},\nPOST /api/stop, POST /api/reset, GET /api/state, WebSocket /ws (state, plan, step, detections). Runs in mock mode with no server."}, {"id": "09", "file": "09-stove-guardian.html", "title": "Stove First Responder", "desc": "An overhead camera and robot arm that watch the stove, escalate calmly, and slide a lid over a grease fire.", "features": ["Canvas overhead camera of a 4-burner stove with per-burner status (off / heating / boiling / boil-over risk / smoke / flame)", "Perceptron video event timeline with confidence-scored markers (person left, pan unattended, smoke likely, flame)", "4-step escalation ladder: chime, text owner via Photon with snapshot, arm slides lid onto pan, call 911", "\"Simulate grease fire\" full scenario with arm animation (2-link IK) sliding the lid, plus a boil-over drill that de-escalates early", "Unattended minutes counter, latched STOP for the arm, mock Photon phone thread with camera snapshot", "\"Why not water?\" card and fire stats"], "sponsors": "Perceptron Robotics (arm lid-cover skill), Perceptron Perception (video event detection, object localization),\nPhoton (iMessage/SMS owner alerts with snapshot), Tiger Data (time-series of burner temps + events), Gemini API (optional incident summary)", "hooks": "- POST /api/perception/video-events  (clip or frame batch in, events out: person_left, unattended_cookware, smoke, flame)\n- WS /ws  events: stove.status, stove.event, ladder.step, arm.progress, arm.stopped\n- POST /api/photon/send  { to, text, snapshot_jpeg } ; webhook /api/photon/reply\n- POST /api/arm/skill/cover_pan  { burner:2 }  ; POST /api/arm/stop (latched)\n- POST /api/dispatch/call  (human confirmation or auto after timeout)\n- Reach contract (../reach/CONTRACT.md): GET /api/state, POST /api/request, WS /ws; defaults to mock mode here"}, {"id": "10", "file": "10-pantry-fifo.html", "title": "Pantry Rotation", "desc": "An arm and camera read expiry dates, put the soonest-to-expire food at the front, suggest recipes, and send the rest to a community fridge.", "features": ["Fridge shelf grid (3 shelves, 15 items) colored by days-to-expiry, with auto OCR scan sweep on load", "Wrist camera panel showing the label crop the OCR is reading, with confidence and honest \"estimated, no printed date\" cases", "FIFO rearrangement: arm swaps items so first-expiring sit at the front; animated arm overlay, move counter, Before/After toggle", "\"Use these first\" list with a Gemini (mock) recipe built from soon-expiring items, regenerate, and \"I cooked this\"", "Impact counters: dollars saved, kg food rescued, kg CO2e avoided", "Donation mode for a community fridge: eligibility rules, adjustable window, arm moves items to donate bin, neighborhood alert + claims", "Latched STOP for the arm"], "sponsors": "Perceptron Robotics (arm pick-and-place, FIFO swaps), Perceptron Perception (OCR on expiry labels, object localization),\nGemini API (recipe from expiring items), Photon (neighborhood alert text), Community Kitchen track (donation mode),\nMongoDB Atlas / Tiger Data (inventory + expiry time series), Backboard (household memory: what you actually eat)", "hooks": "- POST /api/detect  (Reach contract, items + boxes) ; POST /api/perception/ocr { crop } -> { text, date, conf }\n- GET /api/pantry/inventory ; POST /api/pantry/rearrange { shelf, order[] } ; WS /ws events: arm.progress, arm.stopped, pantry.updated\n- POST /api/gemini/recipe { items[] } -> { title, steps[] }\n- POST /api/photon/send (neighborhood group text) ; POST /api/community-fridge/offer { items[] }\n- POST /api/arm/stop (latched) ; mock mode by default, works with no server"}, {"id": "11", "file": "11-judge-arena.html", "title": "Generalization Arena", "desc": "A live judging arena where judges randomize the scene and three robot policies compete trial by trial with honest confidence intervals.", "features": ["Scene randomizer slot machine (object position, distractors, lighting, table color) with lock/reroll per reel", "Top-down table map: drag and drop the target object before each trial, base + reach envelope shown", "One-click \"Run trial\": all three policies attempt the same scene, animated arm sweep, result stamped", "Scoreboard: scripted IK baseline vs ACT fine-tuned vs Perceptron checkpoint, success rate, Wilson 95% CI bars, avg time", "Scatter of trial positions colored success/fail per policy (filterable) to reveal weak zones", "Giant audience number \"N trials, X% success\", leader banner, trial log", "Share results QR (generated fake QR pattern seeded from results) + copyable link", "Latched STOP, auto-judge mode (auto-spin + auto-run), reset"], "sponsors": "Perceptron Robotics (checkpoint vs fine-tune comparison), Perceptron Perception (object localization feeding the map), Tiger Data (trial time series), MongoDB Atlas (trial documents), Solana (optional on-chain result attestation), GoDaddy (share domain)", "hooks": "GET /api/state, POST /api/detect (object xy for the map), POST /api/request {item, xy, policy}, WS /ws events: policy_step, trial_result, estop; POST /api/trials (persist), GET /api/trials?policy="}, {"id": "12", "file": "12-failure-lab.html", "title": "Failure Lab Notebook", "desc": "A lab notebook that grades every robot attempt, shows where the policy looked, explains the failure, and queues a corrective demo.", "features": ["Trial notebook: 60 mock trials, filter to failures, pick any to inspect (Fig. numbering like a lab notebook)", "Frame sequence strip (5 canvas frames) with scrubber and autoplay of the attempt", "Attention / saliency heatmap overlay (gaussian blobs) toggle with opacity slider", "Auto failure taxonomy (missed grasp, slipped, wr eo ; POST /api/perception/video-qa {episode, t0, t1, question} ; PUT /api/episodes/{id}/segments ; PATCH /api/episodes/{id} {success, reason} ; PATCH /api/episodes/{id}/flags/{fid} {resolved} ; GET /api/datasets/{id}/coverage ; GET /api/datasets/{id}/agreement ; POST /api/datasets/{id}/export {format:\"lerobot-v2.1\", filters} (SSE progress)"}, {"id": "32", "file": "32-tray-setup.html", "title": "Tray Setup Planner", "desc": "Pre-op Mayo tray setup from a surgeon preference card, with OCR, remembered preferences, arm layout and per-slot verification.", "features": ["Pick or upload a surgeon preference card; Perceptron OCR (mock) extracts procedure, surgeon, instruments with quantities, glove size, special requests", "Backboard memory of each surgeon's layout preferences (e.g. needle driver on the right), applied to the plan, editable, saved from a finished layout", "Arm lays out instruments from a supply bin onto the Mayo tray, step by step, with detected vs expected per slot (green check / red mismatch, auto-corrected)", "Missing item alert pauses the run, Photon text to supply with simulated replies, then resumes (or skip item)", "Latched STOP, speed control, run log, printable-looking final layout sheet (no print button)"], "sponsors": "Perceptron Robotics (SO-101 pick and place), Perceptron Perception (OCR of card, instrument detection per slot), Backboard (surgeon preference memory), Photon (supply text), Community Kitchen (healthcare, patient safety)", "hooks": "POST /api/ocr {image} -> fields; POST /api/detect {slot} -> label+conf; POST /api/request {action:\"place\", item, slot} via safety gate; GET/PUT /api/memory/{surgeon} (Backboard); POST /api/photon/send {to, body}; WS /ws events: arm_state, slot_verified, stop"}, {"id": "33", "file": "33-telementor.html", "title": "Telementor Link", "desc": "Remote surgical telementoring with anchored annotations, a gated hand-that-next command, session recording and a Photon bandwidth fallback.", "features": ["Split view: OR monitor (live box trainer camera with robot arm and tracked objects) and a mentor's phone", "Mentor draws arrows and circles on a live or frozen frame; they appear on the OR monitor anchored to tracked objects (suture pad, needle, tray tools) and follow them", "Mentor taps a tray instrument to say \"hand that next\": goes through the safety gate (checklist incl. link latency limit) then a local surgeon confirm before the arm moves", "Latency indicator with sparkline, bitrate, fps; simulate bandwidth drop", "Session recording with annotation timeline (arrows, circles, requests, link events, Photon), click a marker to review its snapshot", "Photon fallback: when bandwidth drops the mentor gets a text with a snapshot, replies 1 to mark up the snapshot over a tiny vector channel", "Latched STOP on the OR side, training prototype notice"], "sponsors": "Perceptron Robotics (SO-101 handoff primitive), Perceptron Perception (object tracking and detection for annotation anchors), Photon (bandwidth fallback text with snapshot), Gemini API (optional voice relay), Tiger Data (latency and event time series), Community Kitchen (healthcare access, training more surgeons)", "hooks": "WS /ws/telementor (frames, annotation vectors, link stats); POST /api/detect {frame} -> tracked object ids+boxes; POST /api/request {action:\"handoff\", tool, source:\"mentor\"} through the safety gate; POST /api/confirm {id, approve}; POST /api/photon/send {to, body, media}; POST /api/stop; GET /api/session/{id}/events (timeline)"}, {"id": "34", "file": "34-handoff-challenge.html", "title": "Be the Surgeon", "desc": "A game-show style judge challenge where you call random instruments and watch the SO-101 hand them over, scored live against a human scrub tech baseline.", "features": ["\"Be the surgeon\" judge challenge: randomizer deck of 6 prop instruments, shuffled 3x3 tray positions, 0-3 distractor items", "Gloved / bare / mixed hand, hand position anywhere in the handoff zone (random or pinned by clicking the scene or heatmap)", "Live round state machine: LISTENING > LOCATING > PICKING > WAITING FOR PALM > HANDOFF > VERIFIED (with retries and honest failures)", "Scoreboard: correct instrument, handle-first, latency, retries per round; ARM row vs human scrub-tech baseline row (placeholder, verify)", "Heatmap of hand positions where handoffs succeeded or failed; click it to pin the next hand position", "Giant audience counter and projector mode (P); latched STOP (Esc), auto-run (A), next round (Space), speed 1x/2x/4x", "Everything is MOCK and simulated. Prop instruments only. Training/research prototype, not for clinical use."], "sponsors": "Perceptron Robotics (pick + present primitive), Perceptron Perception (instrument and palm detection, OCR tray tags),\nGemini API (voice intent for \"scalpel, please\"), Tiger Data (per-round latency time series), Backboard (surgeon preference cards), Photon (alert circulating nurse on repeated failure)", "hooks": "POST /api/request {task:\"handoff\", instrument} ; GET /api/detect (tray boxes + palm box) ; WS /ws events\n(state, detection, handoff_result {instrument_ok, handle_first, latency_ms, retries, hand_xy}) ; POST /api/stop ; POST /api/tsdb/handoffs (Tiger Data insert).\nDefault is mock mode, no server needed. See ../reach/CONTRACT.md."}, {"id": "35", "file": "35-surgeon-pitch.html", "title": "Surgeon Pitch Deck", "desc": "A Swiss-poster style three minute pitch presenter for the SO-101 surgical assistant with timer, speaker notes, live demo slot and backup video.", "features": ["Keynote-style 3-minute pitch presenter for the surgical assistant idea: 7 slides on a 16:9 stage that scales to any screen", "Arrow keys / Space / PageUp / PageDown / swipe / on-screen buttons; Home and End; F for fullscreen", "3:00 countdown timer (T start/pause, R reset, auto-starts when you leave the title slide), per-slide time targets and ahead/behind pace pill", "N toggles speaker notes with timing cues; B toggles a backup video slide (load a local screen recording or drop a file)", "Live demo slot with big state ladder LISTENING > LOCATING > PICKING > WAITING FOR PALM > HANDOFF > VERIFIED, mock camera, latched STOP", "Results slide with animated counters (mock values, labeled), architecture SVG with animated data flow, honest what's-next slide (sterility, FDA path), the ask", "Statistics on the hook slide are deliberate [verify] placeholders. Nothing here is a clinical claim."], "sponsors": "Perceptron Robotics (SO-101 + policy), Perceptron Perception (detect/track, OCR, palm), Gemini API (intent), Photon (nurse approvals and alerts), Tiger Data (time series), Backboard (preference cards), Community Kitchen framing (healthcare access, patient safety)", "hooks": "Demo slide would subscribe to WS /ws (state events: listening, locating, picking, waiting_palm, handoff, verified) and GET /api/state;\nPOST /api/stop for the STOP button; results slide would read GET /api/stats (handoffs, success_rate, median_latency_ms, demos). Mock mode by default, see ../reach/CONTRACT.md."}, {"id": "36", "file": "36-scrub-dashboard.html", "title": "Scrub Status Board", "desc": "Prototype of the Scrub dashboard: live tray camera, current step, what is out, event log, pickers, stop, handoff times and success tables, driven by a mock event stream.", "features": ["Live camera panel (mock canvas: tray slots, items, return spot, scalpel safe spot, hand, arm gripper). Live mode swaps in <img src=\":8001/stream\">", "Current step of the request, with the full step rail (idle ... homing) and a request clock", "What is out: running count and names", "Event log fed by WS /events messages", "Setting picker (surgical / dental / bench, with each setting's three items) and lighting picker (bright / normal / dim)", "STOP button and spacebar as STOP, latched until cleared", "Handoff times (request_to_hand_s) with median, and success tables shaped like GET /stats", "Scripted scenario loop: \"hemostat please\", safe-spot item, return spot, \"what's out?\", forced grasp miss with one retry"], "sponsors": "Perceptron Robotics (the arm and tray state it shows), Perceptron Perception (tray and hand boxes drawn on the camera), MongoDB Atlas (the stats tables come from the ledger), Photon and ElevenLabs (the heard text and say lines)", "hooks": ""}, {"id": "37", "file": "37-scrub-voice.html", "title": "Scrub Voice Line", "desc": "The Scrub voice path made visible: a phone call on speaker, the Gemini parse pipeline, the controller event and the spoken reply, logged on paper tape.", "features": [], "sponsors": "", "hooks": ""}, {"id": "38", "file": "38-scrub-trays.html", "title": "Scrub Trays", "desc": "Three settings, one tray model: slots, return spot, safe spot, hand zone, live TrayState, put-back flow, count and mismatch read-back.", "features": [], "sponsors": "", "hooks": ""}];
const GROUPS = [
  ["Scrub: voice pick and hand", ["36","37","38","24","25","32","34","30","31","35"]],
  ["Scrub: further out", ["29"]],
  ["Off concept: surgery tasks (kept for reference)", ["26","27","28","33"]],
  ["Make the robot observable", ["01","02","11","12"]],
  ["Robot learning tools", ["03","04","22","23"]],
  ["People it serves", ["07","05","06","18","20","21"]],
  ["Kitchen tasks", ["08","09","10","13","14","19"]],
  ["Community and memory", ["15","16"]],
  ["Demo day", ["17"]]
];
const PICKS = new Set(["36","37","38","24","25","34","35"]);
const TRACKS = ["Perceptron","Photon","Gemini","Tiger","Backboard","Mongo","Solana","Vultr"];
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(DATA.map(d => [d.id, d]));
let filter = null, cur = null;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function matches(d){return !filter || d.sponsors.toLowerCase().includes(filter.toLowerCase())}
function renderFilters(){
  $("filters").innerHTML = ["All",...TRACKS].map(t=>{
    const on = (t==="All"&&!filter)||t===filter;
    return `<button type="button" class="chipbtn" data-t="${t}" aria-pressed="${on}">${t}</button>`}).join("");
}
function renderList(){
  $("list").innerHTML = GROUPS.map(([g,ids])=>{
    const items = ids.map(i=>byId[i]).filter(Boolean).filter(matches);
    if(!items.length) return "";
    return `<section class="group"><h2>${g}</h2><ul>${items.map(d=>`<li><button type="button" class="item" data-id="${d.id}" aria-current="${d.id===cur}"><span class="num">${d.id}</span><span><span class="iname">${esc(d.title)}${PICKS.has(d.id)?'<span class="pick">core pick</span>':''}</span><span class="idesc">${esc(d.desc)}</span></span></button></li>`).join("")}</ul></section>`;
  }).join("") || '<p class="empty">No prototype uses this track yet.</p>';
}
function show(id){
  const d = byId[id]; if(!d) return; cur = id;
  $("ptitle").firstChild.nodeValue = d.title; $("pdesc").textContent = d.desc;
  $("frame").src = d.file; $("open").href = d.file;
  $("feat").innerHTML = d.features.map(f=>`<li>${esc(f)}</li>`).join("") || '<li class="empty">Not listed</li>';
  $("spons").innerHTML = d.sponsors.split(/[,;]\s*(?![^()]*\))/).filter(Boolean).map(s=>`<span class="tag">${esc(s.replace(/\s*\(.*\)/,"").trim())}</span>`).join("");
  $("hooks").textContent = d.hooks || "Not listed";
  renderList();
  try{localStorage.setItem("bench-cur",id)}catch(e){}
  if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
}
$("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.t==="All"?null:b.dataset.t;renderFilters();renderList()});
$("list").addEventListener("click",e=>{const b=e.target.closest(".item");if(b)show(b.dataset.id)});
function setView(phone){$("stage").classList.toggle("phone",phone);$("vPhone").setAttribute("aria-pressed",phone);$("vDesk").setAttribute("aria-pressed",!phone)}
$("vDesk").onclick=()=>setView(false); $("vPhone").onclick=()=>setView(true);
$("stats").innerHTML = `<span><b>${DATA.length}</b> prototypes</span><span><b>${PICKS.size}</b> core picks</span><span><b>0</b> servers needed</span>`;
renderFilters();
let start = location.hash.slice(1); try{ if(!byId[start]) start = localStorage.getItem("bench-cur") }catch(e){}
show(byId[start] ? start : (byId["36"] ? "36" : (byId["24"] ? "24" : "01")));
</script>
